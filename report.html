<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>举报 - 梦想星域服务器</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4A90E2',
                        onPrimary: '#FFFFFF',
                        primaryContainer: '#E8F0FE',
                        onPrimaryContainer: '#002D6D',
                        surface: '#FFFFFF',
                        onSurface: '#1C1B1F',
                        surfaceContainer: '#F5F9FF',
                        surfaceContainerHighest: '#ECEEF4',
                        outline: '#74777F',
                        danger: '#E53935',
                        onDanger: '#FFFFFF'
                    },
                    fontFamily: {sans: ['Inter', 'system-ui', 'sans-serif']},
                    borderRadius: {
                        'md3-sm': '8px','md3': '16px','md3-lg': '24px','md3-full': '9999px'
                    },
                    boxShadow: {
                        '3d-1': '0 2px 8px rgba(0, 0, 0, 0.06), 0 4px 12px rgba(74, 144, 226, 0.08)',
                        '3d-2': '0 4px 16px rgba(0, 0, 0, 0.08), 0 8px 24px rgba(74, 144, 226, 0.12)',
                        '3d-3': '0 8px 24px rgba(0, 0, 0, 0.1), 0 16px 40px rgba(74, 144, 226, 0.15)',
                        '3d-raised': 'inset 0 2px 1px rgba(255, 255, 255, 0.9), inset 0 -2px 2px rgba(0, 0, 0, 0.06), 0 4px 12px rgba(74, 144, 226, 0.12)',
                        '3d-danger': 'inset 0 2px 1px rgba(255, 255, 255, 0.9), inset 0 -2px 2px rgba(0, 0, 0, 0.06), 0 4px 12px rgba(229, 57, 53, 0.12)',
                    }
                }
            }
        }
    </script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        html{scroll-behavior:smooth;perspective:1200px;-webkit-perspective:1200px;}
        body{background:#fff;font-family:Inter;color:#1C1B1F;overflow-x:hidden;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;will-change:transform;min-height:100vh;}
        .md3-transition{transition:all 400ms cubic-bezier(0.2,0,0,1);}
        .md3-ripple{position:relative;overflow:hidden;}
        .md3-ripple::after{content:'';position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity 150ms;}
        .md3-ripple:hover::after{opacity:0.08;}
        .md3-ripple:active::after{opacity:0.12;}
        .card-3d{transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform 500ms;will-change:transform;}
        .card-3d-hover:hover{transform:translateY(-8px) translateZ(20px) rotateX(2deg);-webkit-transform:translateY(-8px) translateZ(20px) rotateX(2deg);}
        .btn-3d{transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:all 200ms;}
        .btn-3d:hover{transform:translateY(-4px) translateZ(10px);-webkit-transform:translateY(-4px) translateZ(10px);}
        .btn-3d:active{transform:translateY(0) translateZ(2px);-webkit-transform:translateY(0) translateZ(2px);}
        .text-3d-light{text-shadow:0 2px 4px rgba(74,144,226,.1),0 4px 8px rgba(74,144,226,.15);}
        @keyframes fadeInUp3d{from{opacity:0;transform:translateY(30px) translateZ(-50px);-webkit-transform:translateY(30px) translateZ(-50px);}to{opacity:1;transform:translateY(0) translateZ(0);-webkit-transform:translateY(0) translateZ(0);}}
        .animate-in-3d{animation:fadeInUp3d 700ms forwards;}
        .animate-delay-100{animation-delay:100ms;}
        .animate-delay-200{animation-delay:200ms;}
        .scroll-animate-3d{opacity:0;transform:translateY(30px) translateZ(-50px);-webkit-transform:translateY(30px) translateZ(-50px);transition:all 700ms;}
        .scroll-animate-3d.visible{opacity:1;transform:translateY(0) translateZ(0);-webkit-transform:translateY(0) translateZ(0);}
        .parallax-layer{transition:transform 600ms;-webkit-transition:transform 600ms;will-change:transform;}
        .parallax-bg{transform:translateZ(-100px) scale(2);-webkit-transform:translateZ(-100px) scale(2);}
        .parallax-front{transform:translateZ(0);-webkit-transform:translateZ(0);}
        @keyframes float3d{0%,100%{transform:translateY(0) rotate(0deg);-webkit-transform:translateY(0) rotate(0deg);}50%{transform:translateY(-20px) rotate(5deg);-webkit-transform:translateY(-20px) rotate(5deg);}}
        .float-animate-1{animation:float3d 6s infinite ease-in-out;}
        .float-animate-2{animation:float3d 8s infinite ease-in-out;animation-delay:1s;}
    </style>
</head>
<body>
    <!-- 顶部导航栏 与原风格完全统一 -->
    <header class="fixed top-0 w-full bg-surface z-50 shadow-sm">
        <div class="container mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="material-symbols-outlined text-primary text-2xl">public</span>
                <span class="text-lg font-semibold">梦想星域服务器</span>
            </div>
            <a href="https://game.ri3bz6x.cn/" class="flex items-center gap-2 text-primary px-4 py-2 rounded-md3-full md3-ripple md3-transition">
                <span class="material-symbols-outlined text-sm">arrow_back</span>
                <span>返回</span>
            </a>
        </div>
    </header>

    <!-- 背景视差层 与原风格完全统一 -->
    <div class="fixed inset-0 overflow-hidden" style="transform-style:preserve-3d;-webkit-transform-style:preserve-3d;z-index:-1;">
        <div class="parallax-layer parallax-bg absolute inset-0">
            <div class="absolute top-0 right-0 w-1/2 h-1/2 bg-primaryContainer rounded-bl-[120px] opacity-40 float-animate-1"></div>
            <div class="absolute bottom-0 left-0 w-1/3 h-1/3 bg-primaryContainer rounded-tr-[120px] opacity-30 float-animate-2"></div>
        </div>
    </div>

    <!-- 主体内容 双板块布局 -->
    <main class="min-h-screen flex items-center justify-center pt-16 pb-10 px-4">
        <div class="container mx-auto max-w-4xl">
            <!-- 页面主标题 -->
            <div class="text-center mb-16">
                <h1 class="text-[clamp(2.5rem,8vw,4rem)] font-bold text-onSurface mb-4 animate-in-3d text-3d-light">
                    DSS举报系统
                </h1>
                <p class="text-[clamp(1rem,3vw,1.2rem)] text-outline animate-in-3d animate-delay-100">
                    服务器违规行为举报通道
                </p>
            </div>

            <!-- 双板块卡片容器 -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <!-- 主举报系统板块 -->
                <a href="http://107.172.231.70:42339/" target="_blank" class="scroll-animate-3d">
                    <div class="bg-surface rounded-md3 p-8 h-full shadow-3d-2 card-3d card-3d-hover text-center md3-ripple">
                        <div class="w-16 h-16 mx-auto mb-6 rounded-md3-full bg-primaryContainer flex items-center justify-center">
                            <span class="material-symbols-outlined text-primary text-4xl">gavel</span>
                        </div>
                        <h2 class="text-2xl font-semibold text-onSurface mb-3">DSS举报系统</h2>
                        <p class="text-outline text-sm leading-relaxed">
                            服务器推荐举报通道
                        </p>
                    </div>
                </a>

                <!-- 备用举报板块 -->
                <a href="https://github.com/honjiu/DreamStar-Server-Report" target="_blank" class="scroll-animate-3d">
                    <div class="bg-surface rounded-md3 p-8 h-full shadow-3d-2 card-3d card-3d-hover text-center md3-ripple">
                        <div class="w-16 h-16 mx-auto mb-6 rounded-md3-full bg-surfaceContainerHighest flex items-center justify-center">
                            <span class="material-symbols-outlined text-onSurface text-4xl">backup</span>
                        </div>
                        <h2 class="text-2xl font-semibold text-onSurface mb-3">备用举报</h2>
                        <p class="text-outline text-sm leading-relaxed">
                            仅在DSS举报系统不可用时使用，基于Github Issues实现，使用前请先登录Github账号
                        </p>
                    </div>
                </a>
            </div>
        </div>
    </main>

    <!-- 页脚 与原风格完全统一 -->
    <footer class="bg-surface py-8">
        <div class="container mx-auto px-4">
            <div class="max-w-4xl mx-auto text-center">
                <div class="w-full h-px bg-outline/20 mb-6"></div>
                <p class="text-outline/80 text-sm">Copyright © 2025-2026 DreamStar Server. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script>
        // 滚动入场动画 与原页面逻辑一致
        const observer=new IntersectionObserver(e=>{
            e.forEach(i=>{if(i.isIntersecting)i.target.classList.add('visible');});
        },{threshold:0.1,rootMargin:'0px 0px -50px 0px'});
        document.querySelectorAll('.scroll-animate-3d').forEach(el=>observer.observe(el));

        // 视差滚动效果 与原页面逻辑一致
        window.addEventListener('scroll',()=>{
            const scrollY=window.scrollY;
            document.querySelectorAll('.parallax-bg').forEach(layer=>{
                layer.style.transform=`translateY(${scrollY*0.15}px) translateZ(-100px) scale(2)`;
                layer.style.webkitTransform=`translateY(${scrollY*0.15}px) translateZ(-100px) scale(2)`;
            });
        });
    </script>
</body>
</html>
