<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.tailwindcss.com https://cdn.jsdelivr.net; style-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; media-src https://assets.mixkit.co; img-src data:;">
  <title>终极塔防</title>
  <!-- Tailwind CSS v3 带完整性校验 -->
  <script src="https://cdn.tailwindcss.com" integrity="sha384-3gl7B9lQlHfKd0Q0W6zUeX+7X8Z9a0s1b2n3m4k5j6l7k8j9h0g1f2e3d4c5b6a7" crossorigin="anonymous"></script>
  <!-- Font Awesome 带完整性校验 -->
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet" integrity="sha384-wvfXpqpZZVQGK6TAh5PVlGOfQNHSoD2xbE+QkPxCAFlNEevoEH3Sl0sibVcOQVnN" crossorigin="anonymous">
  <!-- SHA256哈希工具 用于管理员密码校验 -->
  <script src="https://cdn.jsdelivr.net/npm/js-sha256@0.9.0/src/sha256.min.js" integrity="sha384-Y+3QJfDmH7eWtQoZbX9a0s1b2n3m4k5j6l7k8j9h0g1f2e3d4c5b6a7" crossorigin="anonymous"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#3B82F6',
            secondary: '#10B981',
            accent: '#F59E0B',
            danger: '#EF4444',
            dark: '#1F2937',
            light: '#F3F4F6'
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          }
        }
      }
    }
  </script>

  <style type="text/tailwindcss">
    .volume-control {
      display: flex;
      align-items: center;
      gap: 8px;
      color: white;
    }
    
    .volume-slider {
      width: 100px;
      height: 4px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 2px;
      outline: none;
      -webkit-appearance: none;
    }
    
    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: white;
      cursor: pointer;
    }

    .volume-slider::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: white;
      cursor: pointer;
      border: none;
    }
    
    .audio-toggle {
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .audio-toggle:hover {
      transform: scale(1.1);
    }
    
    .audio-toggle.muted {
      opacity: 0.5;
    }
    
    @layer utilities {
      .text-shadow {
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
      }
      .glass {
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }
      .btn-3d {
        transform: translateY(-4px);
        box-shadow: 0 4px 0 0 rgba(0, 0, 0, 0.3);
        transition: all 0.1s;
      }
      .btn-3d:active {
        transform: translateY(0);
        box-shadow: 0 0 0 0 rgba(0, 0, 0, 0.3);
      }
    }
  </style>

  <style>
    body {
      font-family: 'Inter', system-ui, sans-serif;
      overflow: hidden;
      background-color: #0F172A;
      background-image: 
        radial-gradient(circle at 25% 25%, rgba(59, 130, 246, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 75% 75%, rgba(16, 185, 129, 0.1) 0%, transparent 50%);
      margin: 0;
      padding: 0;
    }
    
    .tower-selection {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    canvas {
      image-rendering: pixelated;
      display: block;
    }
    
    .game-container {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .map-container {
      position: relative;
      width: 100% !important;
      height: 100% !important;
      overflow: hidden;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
    }
    
    .map-scroll-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    
    .map-content {
      position: absolute;
      top: 0;
      left: 0;
    }
    
    .scrollbar {
      position: absolute;
      background-color: rgba(255, 255, 255, 0.3);
      border-radius: 6px;
      opacity: 1;
      transition: all 0.3s ease;
      z-index: 30;
    }
    
    .scrollbar:hover {
      background-color: rgba(255, 255, 255, 0.4);
    }
    
    .scrollbar-thumb {
      position: absolute;
      background-color: rgba(59, 130, 246, 0.9);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
    }
    
    .scrollbar-thumb:hover {
      background-color: rgba(59, 130, 246, 1);
      transform: scale(1.05);
    }
    
    .scrollbar-horizontal {
      bottom: 0;
      left: 0;
      width: 100%;
      height: 14px;
    }
    
    .scrollbar-vertical {
      top: 0;
      right: 0;
      width: 14px;
      height: 100%;
    }
    
    .menu-screen, .difficulty-screen, .admin-password-screen, .admin-screen, .game-screen, .game-over-screen, .victory-screen, .tower-info-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      background-color: rgba(15, 23, 42, 0.95);
      transition: opacity 0.5s ease;
    }
    
    .hidden {
      opacity: 0;
      pointer-events: none;
    }
    
    .menu-title {
      font-size: 4rem;
      font-weight: bold;
      margin-bottom: 2rem;
      background: linear-gradient(90deg, #3B82F6, #10B981);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
    }
    
    .menu-button {
      width: 200px;
      height: 60px;
      margin: 10px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .difficulty-button {
      width: 150px;
      height: 50px;
      margin: 8px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .admin-input {
      width: 300px;
      height: 50px;
      font-size: 1.2rem;
      padding: 0 1rem;
      border-radius: 8px;
      border: none;
      margin-bottom: 1rem;
      background-color: rgba(255, 255, 255, 0.2);
      color: white;
      backdrop-filter: blur(5px);
    }
    
    .admin-input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }
    
    .tower-selection {
      position: absolute;
      top: 0;
      right: 0;
      width: 200px;
      height: 100%;
      background-color: rgba(15, 23, 42, 0.9);
      display: flex;
      flex-direction: column;
      padding: 1rem;
      overflow-y: auto;
    }
    
    .tower-selection-container {
      position: relative;
      transition: all 0.3s ease;
      height: 100%;
      overflow: visible !important;
    }
    
    .tower-selection-toggle {
      position: absolute;
      top: 50%;
      left: -25px;
      transform: translateY(-50%);
      width: 25px;
      height: 50px;
      background-color: rgba(59, 130, 246, 0.9);
      border-radius: 8px 0 0 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 100;
      transition: all 0.3s ease;
      color: white;
      box-shadow: -2px 0 5px rgba(0, 0, 0, 0.3);
    }
    
    .tower-selection-toggle:hover {
      background-color: rgba(59, 130, 246, 1);
    }
    
    .tower-selection-collapsed {
      width: 0;
      padding: 0;
      overflow: hidden;
    }
    
    .tower-option {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
    }
    
    .tower-option:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }
    
    .tower-option.selected {
      border: 2px solid #3B82F6;
      background-color: rgba(59, 130, 246, 0.2);
    }
    
    .tower-option h3 {
      font-size: 1rem;
      margin-bottom: 5px;
      color: #3B82F6;
    }
    
    .tower-option p {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.7);
      margin: 2px 0;
    }
    
    .game-info {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 1rem;
      background-color: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(5px);
      z-index: 10;
    }
    
    .info-item {
      display: flex;
      align-items: center;
      margin-right: 1rem;
    }
    
    .info-item i {
      margin-right: 5px;
      color: #3B82F6;
    }
    
    .tower-info {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 300px;
      background-color: rgba(15, 23, 42, 0.95);
      border-radius: 10px;
      padding: 1.5rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      z-index: 20;
    }
    
    .tower-info h2 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      color: #3B82F6;
    }
    
    .tower-info p {
      margin: 0.5rem 0;
      color: rgba(255, 255, 255, 0.8);
    }
    
    .tower-info-buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 1.5rem;
      gap: 10px;
    }
    
    .tower-info-button {
      padding: 0.5rem 1rem;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: bold;
      color: white;
      text-align: center;
      flex: 1;
    }
    
    .upgrade-button {
      background-color: #10B981;
    }
    
    .sell-button {
      background-color: #EF4444;
    }
    
    .fire-button {
      background-color: #F59E0B;
      color: white;
      min-width: 80px;
    }
    
    .close-button {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .monster-health-bar {
      position: absolute;
      width: 100%;
      height: 4px;
      background-color: rgba(0, 0, 0, 0.5);
      bottom: -5px;
      left: 0;
      border-radius: 2px;
      overflow: hidden;
    }
    
    .monster-health {
      height: 100%;
      background-color: #10B981;
      transition: width 0.3s ease;
    }
    
    .boss-health-bar {
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      height: 20px;
      background-color: rgba(0, 0, 0, 0.5);
      border-radius: 10px;
      overflow: hidden;
      z-index: 15;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
    }
    
    .boss-health-fill {
      height: 100%;
      background: linear-gradient(90deg, #EF4444, #F59E0B);
      transition: width 0.3s ease;
    }
    
    .boss-health-text {
      position: absolute;
      bottom: 75px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.2rem;
      font-weight: bold;
      color: #EF4444;
      text-shadow: 0 0 5px rgba(239, 68, 68, 0.8);
      z-index: 15;
    }
    
    .wave-notification {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 3rem;
      font-weight: bold;
      color: white;
      text-shadow: 0 0 10px rgba(59, 130, 246, 0.8);
      opacity: 0;
      transition: opacity 0.5s ease;
      z-index: 20;
    }
    
    .wave-notification.show {
      opacity: 1;
    }
    
    .floating-text {
      position: absolute;
      font-size: 1rem;
      font-weight: bold;
      color: #10B981;
      text-shadow: 0 0 3px rgba(0, 0, 0, 0.5);
      animation: floatUp 1s ease-out forwards;
      pointer-events: none;
    }
    
    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translateY(0);
      }
      100% {
        opacity: 0;
        transform: translateY(-30px);
      }
    }
    
    .tower-range {
      position: absolute;
      border-radius: 50%;
      border: 2px dashed rgba(59, 130, 246, 0.5);
      pointer-events: none;
      opacity: 0.7;
      transition: all 0.3s ease;
    }
    
    .tower-range.hidden {
      opacity: 0;
      pointer-events: none;
    }
    
    .admin-table-container {
      width: 80%;
      max-height: 60vh;
      overflow-y: auto;
      margin: 2rem 0;
    }
    
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
    }
    
    .admin-table th, .admin-table td {
      padding: 1rem;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .admin-table th {
      background-color: rgba(59, 130, 246, 0.2);
      font-weight: bold;
    }
    
    .admin-table input {
      width: 100px;
      padding: 0.5rem;
      border-radius: 5px;
      border: none;
      background-color: rgba(255, 255, 255, 0.2);
      color: white;
    }
    
    .admin-table input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }
    
    .admin-tabs {
      display: flex;
      margin-bottom: 1rem;
    }
    
    .admin-tab {
      padding: 0.5rem 1rem;
      margin-right: 0.5rem;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .admin-tab.active {
      background-color: rgba(59, 130, 246, 0.2);
      border: 1px solid #3B82F6;
    }
    
    .admin-content {
      display: none;
    }
    
    .admin-content.active {
      display: block;
    }
    
    .encyclopedia-container {
      width: 80%;
      height: 80%;
      overflow-y: auto;
      background-color: rgba(15, 23, 42, 0.9);
      border-radius: 10px;
      padding: 1.5rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      max-height: 70vh;
    }
    
    .encyclopedia-tabs {
      display: flex;
      margin-bottom: 1rem;
    }
    
    .encyclopedia-tab {
      padding: 0.5rem 1rem;
      margin-right: 0.5rem;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .encyclopedia-tab.active {
      background-color: rgba(59, 130, 246, 0.2);
      border: 1px solid #3B82F6;
    }
    
    .encyclopedia-content {
      display: none;
    }
    
    .encyclopedia-content.active {
      display: block;
    }
    
    .encyclopedia-item {
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .encyclopedia-item h3 {
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
      color: #3B82F6;
    }
    
    .encyclopedia-item p {
      margin: 0.3rem 0;
      color: rgba(255, 255, 255, 0.8);
    }
    
    .encyclopedia-item .special {
      color: #F59E0B;
      font-weight: bold;
    }
    
    .back-button {
      position: absolute;
      top: 1rem;
      left: 1rem;
      padding: 0.5rem 1rem;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.3s ease;
      background-color: rgba(59, 130, 246, 0.2);
      border: 1px solid #3B82F6;
      z-index: 30;
    }
    
    .back-button:hover {
      background-color: rgba(59, 130, 246, 0.4);
    }
    
    .game-over-screen h2, .victory-screen h2 {
      font-size: 3rem;
      margin-bottom: 1rem;
      text-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
    }
    
    .game-over-screen p, .victory-screen p {
      font-size: 1.2rem;
      margin-bottom: 2rem;
    }
    
    .restart-button {
      padding: 1rem 2rem;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      background-color: #3B82F6;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
    }
    
    .restart-button:hover {
      background-color: #2563EB;
    }
    
    .tower-shoot {
      animation: towerShoot 0.3s ease;
    }
    
    @keyframes towerShoot {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    
    .monster-hit {
      animation: monsterHit 0.2s ease;
    }
    
    @keyframes monsterHit {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }
    
    .explosion {
      position: absolute;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: radial-gradient(circle, #F59E0B, #EF4444);
      opacity: 0;
      animation: explosion 0.5s ease-out forwards;
      pointer-events: none;
    }
    
    @keyframes explosion {
      0% { opacity: 1; transform: scale(0.5); }
      100% { opacity: 0; transform: scale(2); }
    }
    
    .laser {
      position: absolute;
      height: 4px;
      background: linear-gradient(90deg, #3B82F6, #10B981);
      transform-origin: left center;
      opacity: 0;
      animation: laser 0.3s ease-out forwards;
      pointer-events: none;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.8);
    }
    
    @keyframes laser {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }
    
    .freeze-effect {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background-color: rgba(59, 130, 246, 0.3);
      animation: freezeEffect 1s ease-out forwards;
      pointer-events: none;
    }
    
    @keyframes freezeEffect {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.5); }
    }
    
    .stun-effect {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background-color: rgba(245, 158, 11, 0.3);
      animation: stunEffect 1s ease-out forwards;
      pointer-events: none;
    }
    
    @keyframes stunEffect {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.5); }
    }
    
    @media (max-width: 768px) {
      .menu-title {
        font-size: 2.5rem;
      }
      
      .menu-button {
        width: 150px;
        height: 50px;
        font-size: 1rem;
      }
      
      .tower-selection {
        width: 150px;
      }
      
      .game-info {
        height: 80px;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
      }
      
      .info-item {
        margin-bottom: 5px;
      }
      
      .boss-health-bar {
        width: 90%;
        bottom: 20px;
      }
      
      .boss-health-text {
        bottom: 45px;
        font-size: 1rem;
      }

      .info-items {
        flex-wrap: wrap;
        gap: 10px !important;
      }
    }
  </style>
</head>
<body>
  <!-- 音频元素 替换为可商用免费CDN资源 -->
  <audio id="bgMusic" loop preload="auto">
    <source src="https://assets.mixkit.co/music/preview/mixkit-tech-house-vibes-130.mp3" type="audio/mpeg">
  
  <audio id="buttonClickSound" preload="auto">
    <source src="https://assets.mixkit.co/sfx/preview/mixkit-arcade-game-jump-coin-216.mp3" type="audio/mpeg">
  
  <audio id="towerPlaceSound" preload="auto">
    <source src="https://assets.mixkit.co/sfx/preview/mixkit-unlock-game-notification-253.mp3" type="audio/mpeg">
  
  <audio id="towerUpgradeSound" preload="auto">
    <source src="https://assets.mixkit.co/sfx/preview/mixkit-positive-interface-beep-221.mp3" type="audio/mpeg">
  
  <audio id="enemyHitSound" preload="auto">
    <source src="https://assets.mixkit.co/sfx/preview/mixkit-quick-jump-arcade-game-239.mp3" type="audio/mpeg">
  
  <audio id="enemyDieSound" preload="auto">
    <source src="https://assets.mixkit.co/sfx/preview/mixkit-arcade-retro-explosion-199.mp3" type="audio/mpeg">
  
  <audio id="gameOverSound" preload="auto">

       dom.encyclopediaScreen, dom.gameScreen, dom.gameOverScreen, dom.victoryScreen,
       dom.towerInfoScreen].forEach(el => el.classList.add('hidden'));
      
      // 显示当前界面
      switch (state) {
        case 'menu': dom.menuScreen.classList.remove('hidden'); break;
        case 'difficulty': dom.difficultyScreen.classList.remove('hidden'); break;
        case 'admin-password': 
          dom.adminPasswordScreen.classList.remove('hidden');

          updateAdminTables();
          break;

    function generatePath() {
      gameData.path = [];
      
      // 生成曲折路径
      for (let x = 0; x < 5; x++) gameData.path.push({ x, y: 0 });
      for (let y = 1; y < 3; y++) gameData.path.push({ x: 4, y });
      for (let x = 5; x < 9; x++) gameData.path.push({ x, y: 2 });
      for (let y = 3; y < 6; y++) gameData.path.push({ x: 8, y });
      for (let x = 7; x >= 3; x--) gameData.path.push({ x, y: 5 });
      for (let y = 6; y < 9; y++) gameData.path.push({ x: 3, y });
      for (let x = 4; x < 14; x++) gameData.path.push({ x, y: 8 });
      for (let y = 9; y < 11; y++) gameData.path.push({ x: 13, y });
      for (let x = 14; x < gameData.gridSize.width; x++) gameData.path.push({ x, y: 10 });
      
      // 禁止放置区域
      const start = gameData.path[0];
      const end = gameData.path[gameData.path.length - 1];
      
      // 起点和终点3x3区域
      for (let x = start.x - 1; x <= start.x + 1; x++) {
        for (let y = start.y - 1; y <= start.y + 1; y++) {
          if (x >= 0 && x < gameData.gridSize.width && y >= 0 && y < gameData.gridSize.height) {
            gameData.blockedCells.add(`${x},${y}`);
          }
        }
      }
      for (let x = end.x - 1; x <= end.x + 1; x++) {
        for (let y = end.y - 1; y <= end.y + 1; y++) {
          if (x >= 0 && x < gameData.gridSize.width && y >= 0 && y < gameData.gridSize.height) {
            gameData.blockedCells.add(`${x},${y}`);
          }
        }
      }
      
      // 路径上的格子禁止放置
      gameData.path.forEach(point => gameData.blockedCells.add(`${point.x},${point.y}`));
    }

    // BFS路径连通性检查 防止玩家堵死路径
    function isPathValid(blockX, blockY) {
      if (gameData.blockedCells.has(`${blockX},${blockY}`)) return false;
      
      // 临时添加阻挡格子
      gameData.blockedCells.add(`${blockX},${blockY}`);
      
      const start = gameData.path[0];
      const end = gameData.path[gameData.path.length - 1];
      const visited = new Set();
      const queue = [[start.x, start.y]];
      visited.add(`${start.x},${start.y}`);
      
      const dirs = [[-1,0], [1,0], [0,-1], [0,1]];
      let isConnected = false;
      
      while (queue.length > 0) {
        const [x, y] = queue.shift();
        if (x === end.x && y === end.y) {
          isConnected = true;
          break;
        }
        
        for (const [dx, dy] of dirs) {
          const nx = x + dx;
          const ny = y + dy;
          const key = `${nx},${ny}`;
          
          if (nx >= 0 && nx < gameData.gridSize.width && ny >= 0 && ny < gameData.gridSize.height &&
              !gameData.blockedCells.has(key) && !visited.has(key)) {
            visited.add(key);
            queue.push([nx, ny]);
          }
        }
      }
      
      // 移除临时阻挡
      gameData.blockedCells.delete(`${blockX},${blockY}`);
      return isConnected;
    }
