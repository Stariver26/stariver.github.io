<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>终极塔防-GameBox</title>
  <!-- Tailwind CSS v3 -->
  <script src="https://cdn.tailwindcss.com" rel="noopener noreferrer"></script>
  <!-- Font Awesome -->
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet" rel="noopener noreferrer">
  <script>
    // 音效管理
    const soundManager = {
      musicEnabled: true,
      sfxEnabled: true,
      musicVolume: 0.5,
      sfxVolume: 0.7,
      
      init() {
        // 从localStorage读取持久化设置
        const savedMusic = localStorage.getItem('towerDefense_musicEnabled');
        const savedSfx = localStorage.getItem('towerDefense_sfxEnabled');
        const savedMusicVol = localStorage.getItem('towerDefense_musicVolume');
        const savedSfxVol = localStorage.getItem('towerDefense_sfxVolume');
        
        if (savedMusic !== null) this.musicEnabled = savedMusic === 'true';
        if (savedSfx !== null) this.sfxEnabled = savedSfx === 'true';
        if (savedMusicVol !== null) this.musicVolume = parseFloat(savedMusicVol);
        if (savedSfxVol !== null) this.sfxVolume = parseFloat(savedSfxVol);
        
        // 初始化音量
        this.setMusicVolume(this.musicVolume);
        this.setSfxVolume(this.sfxVolume);
        
        // 初始化开关状态
        this.updateToggleUI();
        
        // 用户交互后尝试播放背景音乐
        document.addEventListener('click', this.tryPlayBackgroundMusic.bind(this), { once: true });
      },
      
      updateToggleUI() {
        const musicToggle = document.getElementById('music-toggle');
        const sfxToggle = document.getElementById('sfx-toggle');
        if (musicToggle) {
          musicToggle.className = this.musicEnabled ? 'fa fa-music audio-toggle' : 'fa fa-music audio-toggle muted';
        }
        if (sfxToggle) {
          sfxToggle.className = this.sfxEnabled ? 'fa fa-volume-up audio-toggle' : 'fa fa-volume-off audio-toggle muted';
        }
      },
      
      tryPlayBackgroundMusic() {
        if (this.musicEnabled) {
          const bgMusic = document.getElementById('bgMusic');
          bgMusic?.play().catch(e => console.log('背景音乐播放失败:', e));
        }
      },
      
      playSound(id) {
        if (!this.sfxEnabled) return;
        const sound = document.getElementById(id);
        if (!sound) return;
        
        try {
          // 克隆音效避免播放中断
          const soundClone = sound.cloneNode();
          soundClone.volume = this.sfxVolume;
          soundClone.play().catch(e => console.log(`音效${id}播放失败:`, e));
        } catch (e) {
          console.error('音效播放异常:', e);
        }
      },
      
      playBackgroundMusic() {
        if (!this.musicEnabled) return;
        const bgMusic = document.getElementById('bgMusic');
        if (bgMusic) {
          bgMusic.volume = this.musicVolume;
          bgMusic.play().catch(e => console.log('背景音乐播放失败:', e));
        }
      },
      
      pauseBackgroundMusic() {
        const bgMusic = document.getElementById('bgMusic');
        bgMusic?.pause();
      },
      
      setMusicVolume(volume) {
        this.musicVolume = volume;
        const bgMusic = document.getElementById('bgMusic');
        if (bgMusic) bgMusic.volume = volume;
        localStorage.setItem('towerDefense_musicVolume', volume);
      },
      
      setSfxVolume(volume) {
        this.sfxVolume = volume;
        localStorage.setItem('towerDefense_sfxVolume', volume);
      },
      
      toggleMusic() {
        this.musicEnabled = !this.musicEnabled;
        localStorage.setItem('towerDefense_musicEnabled', this.musicEnabled);
        this.musicEnabled ? this.playBackgroundMusic() : this.pauseBackgroundMusic();
        this.updateToggleUI();
        return this.musicEnabled;
      },
      
      toggleSfx() {
        this.sfxEnabled = !this.sfxEnabled;
        localStorage.setItem('towerDefense_sfxEnabled', this.sfxEnabled);
        this.updateToggleUI();
        return this.sfxEnabled;
      }
    };
    
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#3B82F6',
            secondary: '#10B981',
            accent: '#F59E0B',
            danger: '#EF4444',
            dark: '#1F2937',
            light: '#F3F4F6'
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          }
        }
      }
    }
  </script>

      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.5); }
    }
    @media (max-width: 768px) {
      .menu-title { font-size: 2.5rem; }
      .menu-button { width: 150px; height: 50px; font-size: 1rem; }
      .tower-selection { width: 150px; }
      .game-info { height: 80px; flex-direction: column; justify-content: center; align-items: flex-start; }
      .info-item { margin-bottom: 5px; }
      .boss-health-bar { width: 90%; bottom: 20px; }
      .boss-health-text { bottom: 45px; font-size: 1rem; }
    }
  </style>
</head>

    // 密码哈希函数（封装防篡改）
    function getPasswordHash(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        const char = str.charCodeAt(i);
        hash = ((hash << 5) - hash) + char;
        hash = hash & hash;
      }
      return hash;
    }

    // 管理员密码验证（密码修改为honjiu，加固防绕过）
    function checkAdminPassword() {
      const password = adminPasswordInput.value.trim();
      adminPasswordInput.value = ''; // 输入后立即清空，防泄露
      
      // 拆分哈希值，增加逆向难度
      const validHash = -1211000000 - 642513; // honjiu的哈希值：-1211642513
      const inputHash = getPasswordHash(password);
      
      // 分层验证，避免直接暴露判断逻辑
      if (inputHash !== validHash) {
        alert('密码错误！');
        return;
      }
      
      // 冻结管理员状态，防控制台篡改
      Object.defineProperty(gameData, 'isAdminMode', {
        value: true,
        writable: false,
        configurable: false
      });
      
      changeGameState('admin');
    }

    // 调整画布大小
    function resizeCanvas() {
      const container = gameCanvas.parentElement;
      const containerWidth = container.clientWidth;
      const containerHeight = container.clientHeight;
      const gameWidth = gameData.gridSize.width * gameData.cellSize + 200;
      const gameHeight = gameData.gridSize.height * gameData.cellSize + 100;
      
      gameCanvas.width = Math.max(gameWidth, containerWidth);
      gameCanvas.height = Math.max(gameHeight, containerHeight);
      
      gameData.gridOffset = {
        x: (gameCanvas.width - gameData.gridSize.width * gameData.cellSize) / 2,
        y: (gameCanvas.height - gameData.gridSize.height * gameData.cellSize) / 2
      };
    }

      // 图鉴标签切换
      document.querySelectorAll('.encyclopedia-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.encyclopedia-tab').forEach(t => t.classList.remove('active'));
          document.querySelectorAll('.encyclopedia-content').forEach(c => c.classList.remove('active'));
          tab.classList.add('active');
          $(`${tab.dataset.tab}-encyclopedia`).classList.add('active');
        });
      });
      
      // 画布事件
      gameCanvas.addEventListener('click', handleCanvasClick);
      gameCanvas.addEventListener('mousemove', handleCanvasMouseMove);
      
      // 炮塔信息界面按钮
      $('upgrade-tower').addEventListener('click', () => {
        upgradeTower();
        soundManager.playSound('buttonClickSound');
      });
      $('sell-tower').addEventListener('click', sellTower);
      $('close-tower-info').addEventListener('click', closeTowerInfo);
      
      // 重新开始按钮
      $('restart-game').addEventListener('click', () => {
        resetGame();
        changeGameState('menu');
        soundManager.playSound('buttonClickSound');
      });
      $('victory-restart').addEventListener('click', () => {
        resetGame();
        changeGameState('menu');
        soundManager.playSound('buttonClickSound');
      });

    // 切换炮塔选择界面
    function toggleTowerSelection() {
      const container = $('tower-selection-container');
      const toggleIcon = $('toggle-icon');
      if (container.classList.contains('tower-selection-collapsed')) {
        container.classList.remove('tower-selection-collapsed');

    // 改变游戏状态
    function changeGameState(state) {
      // 进入管理员界面必须验证状态
      if (state === 'admin' && !gameData.isAdminMode) {
        alert('请先输入正确的管理员密码');
        changeGameState('admin-password');
        return;
      }
      
      gameData.gameState = state;
      
      // 隐藏所有界面
      menuScreen.classList.add('hidden');
      difficultyScreen.classList.add('hidden');
      adminPasswordScreen.classList.add('hidden');
      adminScreen.classList.add('hidden');
      encyclopediaScreen.classList.add('hidden');
      gameScreen.classList.add('hidden');
      gameOverScreen.classList.add('hidden');
      victoryScreen.classList.add('hidden');
      towerInfoScreen.classList.add('hidden');
      
      // 显示当前界面
      switch (state) {
        case 'menu': menuScreen.classList.remove('hidden'); break;
        case 'difficulty': difficultyScreen.classList.remove('hidden'); break;
        case 'admin-password': adminPasswordScreen.classList.remove('hidden'); break;
        case 'admin': adminScreen.classList.remove('hidden'); updateAdminTables(); break;
        case 'encyclopedia': encyclopediaScreen.classList.remove('hidden'); break;
        case 'game': gameScreen.classList.remove('hidden'); break;

          gameOverScreen.classList.remove('hidden');

          soundManager.pauseBackgroundMusic();
          soundManager.playSound('gameOverSound');
          break;
        case 'victory':
          victoryScreen.classList.remove('hidden');
          soundManager.pauseBackgroundMusic();
          soundManager.playSound('victorySound');
          break;
      }
    }

    // 更新管理员设置值（输入过滤，防XSS）
    function updateAdminValue(event) {
      const input = event.target;
      const id = input.dataset.id;
      const property = input.dataset.property;
      const value = Math.max(0, parseFloat(input.value) || 0); // 仅允许非负数

      if (input.closest('#towers-table-body')) {
        const tower = gameData.towerTypes.find(t => t.id === id);

      } else if (input.closest('#monsters-table-body')) {
        const monster = gameData.monsterTypes.find(m => m.id === id);
        if (monster) monster[property] = value;
      }

    // 重置游戏
    function resetGame() {
      // 重置游戏状态
      gameData.currentWave = 1;
      gameData.coreHealth = gameData.maxCoreHealth;
      gameData.isGameOver = false;
      gameData.isVictory = false;
      gameData.isWaveActive = false;
      gameData.waveStartTime = 0;
      gameData.currentBoss = null;
      gameData.isHowitzerTargeting = false;
      gameData.selectedHowitzer = null;
      gameData.selectedTargetCell = null;
      
      // 清空游戏对象
      gameData.towers = [];
      gameData.monsters = [];
      gameData.projectiles = [];
      gameData.explosions = [];
      gameData.effects = [];
      gameData.floatingTexts = [];
      
      // 重置路径
      gameData.blockedCells.clear();

      }

    // 生成路径
    function generatePath() {
      gameData.path = [];
      
      // 生成曲折路径
      for (let x = 0; x < 5; x++) gameData.path.push({ x, y: 0 });
      for (let y = 1; y < 3; y++) gameData.path.push({ x: 4, y });
      for (let x = 5; x < 9; x++) gameData.path.push({ x, y: 2 });
      for (let y = 3; y < 6; y++) gameData.path.push({ x: 8, y });
      for (let x = 7; x >= 3; x--) gameData.path.push({ x, y: 5 });
      for (let y = 6; y < 9; y++) gameData.path.push({ x: 3, y });
      for (let x = 4; x < 14; x++) gameData.path.push({ x, y: 8 });
      for (let y = 9; y < 11; y++) gameData.path.push({ x: 13, y });
      for (let x = 14; x < gameData.gridSize.width; x++) gameData.path.push({ x, y: 10 });
      
      // 禁止放置区域
      const startX = gameData.path[0].x, startY = gameData.path[0].y;
      for (let x = startX - 1; x <= startX + 1; x++) {
        for (let y = startY - 1; y <= startY + 1; y++) {
          if (x >= 0 && x < gameData.gridSize.width && y >= 0 && y < gameData.gridSize.height) {
            gameData.blockedCells.add(`${x},${y}`);
          }
        }
      }
      
      const endPoint = gameData.path[gameData.path.length - 1];
      const endX = endPoint.x, endY = endPoint.y;
      for (let x = endX - 1; x <= endX + 1; x++) {
        for (let y = endY - 1; y <= endY + 1; y++) {
          if (x >= 0 && x < gameData.gridSize.width && y >= 0 && y < gameData.gridSize.height) {
            gameData.blockedCells.add(`${x},${y}`);
          }
        }
      }
      
      gameData.path.forEach(point => gameData.blockedCells.add(`${point.x},${point.y}`));
    }

    // 开始波次
    function startWave() {
      // 波数显示优化
      const { endlessMode, maxBaseWave, bossWave } = gameData.waveSettings;
      waveDisplay.textContent = endlessMode && gameData.currentWave > maxBaseWave 
        ? `波数: ${gameData.currentWave} (无尽)` 
        : `波数: ${gameData.currentWave}/${bossWave}`;
      
      // 波数通知
      waveNotification.textContent = `第${gameData.currentWave}波`;
      waveNotification.classList.add('show');
      setTimeout(() => waveNotification.classList.remove('show'), 2000);
      
      gameData.isWaveActive = true;
      gameData.waveStartTime = Date.now();
      
      // BOSS波
      if (gameData.currentWave === bossWave) {
        generateBoss();
      } else {
        generateMonsters();
      }
    }
    
    // 生成怪物
    function generateMonsters() {
      gameData.monsters = [];
      const { currentWave, waveSettings, difficultySettings, difficulty } = gameData;
      const availableMonsters = currentWave <= 10 ? waveSettings.baseMonsters : waveSettings.allMonsters;
      
      // 无尽模式加成
      let waveMultiplier = 1, monsterCountMultiplier = 1, eliteMonsterChance = 0;
      if (waveSettings.endlessMode) {
        const waveOffset = Math.max(0, currentWave - waveSettings.maxBaseWave);
        waveMultiplier = 1 + waveOffset * waveSettings.monsterHealthMultiplierPerWave;
        monsterCountMultiplier = 1 + waveOffset * waveSettings.monsterCountMultiplierPerWave;
        eliteMonsterChance = waveOffset * waveSettings.eliteMonsterChancePerWave;
      }
      
      // 怪物数量
      let monsterCount = Math.min(5 + currentWave * 2, 50);
      if (waveSettings.endlessMode) {
        monsterCount = Math.min(Math.floor(monsterCount * monsterCountMultiplier), waveSettings.maxMonsterCount);
      }
      
      // 按类型分组
      const monstersByType = {};
      availableMonsters.forEach(type => monstersByType[type] = []);
      
      // 生成怪物
      for (let i = 0; i < monsterCount; i++) {
        let monsterType;
        const rand = Math.random();
        
        if (currentWave <= 10) {
          monsterType = rand < 0.6 ? 'normal' : rand < 0.85 ? 'fast' : 'heavy';
        } else {
          if (rand < 0.25) monsterType = 'normal';
          else if (rand < 0.45) monsterType = 'fast';
          else if (rand < 0.6) monsterType = 'heavy';
          else if (rand < 0.7) monsterType = 'shield';
          else if (rand < 0.78) monsterType = 'healer';
          else if (rand < 0.85) monsterType = 'drone';
          else if (rand < 0.9) monsterType = 'bomber';
          else if (rand < 0.94) monsterType = 'mech';
          else if (rand < 0.97) monsterType = 'thief';
          else {
            const rareTypes = ['charger', 'assassin', 'reaper', 'ice-mage'];
            monsterType = rareTypes[Math.floor(Math.random() * rareTypes.length)];
          }
        }
        
        const monsterData = gameData.monsterTypes.find(m => m.id === monsterType);
        const diff = difficultySettings[difficulty];
        const currentWaveMulti = 1 + currentWave * 0.1;
        const finalWaveMulti = waveSettings.endlessMode ? waveMultiplier : currentWaveMulti;
        
        let health = monsterData.health * diff.monsterHealthMultiplier * finalWaveMulti;
        let speed = monsterData.speed * diff.monsterSpeedMultiplier;
        let coreDamage = monsterData.coreDamage * diff.monsterCoreDamageMultiplier;
        
        if (waveSettings.endlessMode) {
          const waveOffset = Math.max(0, currentWave - waveSettings.maxBaseWave);
          speed *= 1 + waveOffset * waveSettings.monsterSpeedMultiplierPerWave;
        }
        
        // 精英怪物
        let isElite = false;
        if (waveSettings.endlessMode && Math.random() < eliteMonsterChance) {
          isElite = true;
          health *= waveSettings.eliteMonsterHealthMultiplier;
          speed *= waveSettings.eliteMonsterSpeedMultiplier;
          coreDamage *= 2;
        }
        
        const monster = {
          id: `monster-${Date.now()}-${i}`,
          type: monsterType,
          name: isElite ? `精英${monsterData.name}` : monsterData.name,
          health: health,
          maxHealth: health,
          speed: speed,
          coreDamage: coreDamage,
          reward: monsterData.reward,
          position: { x: gameData.path[0].x, y: gameData.path[0].y },
          pathIndex: 0,
          progress: 0,
          isFlying: monsterType === 'drone',
          isStunned: false,
          isSlowed: false,
          slowDuration: 0,
          isElite: isElite,
          isInvulnerable: false,
          invulnerableDuration: 0,
          invulnerableCooldown: 0,
          isBomberActivated: false,
          bomberTimer: 3 + Math.random() * 4,
          healerTimer: 0,
          reaperTimer: 0,
          iceMageTimer: 0,
          isCharging: false,
          originalSpeed: undefined
        };
        
        monstersByType[monsterType].push(monster);
      }
      
      // 交错生成
      const monsterQueues = [];
      availableMonsters.forEach(type => {
        if (monstersByType[type].length > 0) {
          monsterQueues.push({
            type: type,
            queue: [...monstersByType[type]],
            interval: 300 + Math.random() * 200
          });
        }
      });
      
      let globalTimer = 0;
      const interval = 100;
      
      function spawnNextMonster() {
        let spawned = false;
        monsterQueues.forEach(queue => {
          if (queue.queue.length > 0 && globalTimer % Math.round(queue.interval / interval) === 0) {
            const monster = queue.queue.shift();
            gameData.monsters.push(monster);
            spawned = true;
          }
        });
        
        globalTimer++;
        const remaining = monsterQueues.reduce((total, queue) => total + queue.queue.length, 0);
        if (remaining > 0) setTimeout(spawnNextMonster, interval);
      }
      
      if (monsterQueues.length > 0) spawnNextMonster();
    }
    
    // 生成BOSS
    function generateBoss() {
      const bossData = gameData.monsterTypes.find(m => m.id === gameData.waveSettings.bossMonster);
      const diff = gameData.difficultySettings[gameData.difficulty];
      const waveMulti = 1 + gameData.currentWave * 0.1;
      
      const boss = {
        id: `boss-${Date.now()}`,
        type: gameData.waveSettings.bossMonster,
        name: bossData.name,
        health: bossData.health * diff.monsterHealthMultiplier * waveMulti,
        maxHealth: bossData.health * diff.monsterHealthMultiplier * waveMulti,
        speed: bossData.speed * diff.monsterSpeedMultiplier,
        coreDamage: bossData.coreDamage * diff.monsterCoreDamageMultiplier,
        reward: bossData.reward,
        position: { x: gameData.path[0].x, y: gameData.path[0].y },
        pathIndex: 0,
        progress: 0,
        isFlying: false,
        isStunned: false,
        isSlowed: false,
        slowDuration: 0,
        isInvulnerable: false,
        invulnerableDuration: 0,
        summonTimer: 0,
        rocketTimer: 0
      };
      
      gameData.monsters.push(boss);
      gameData.currentBoss = boss;
      
      bossHealthBar.classList.remove('hidden');
      bossHealthText.classList.remove('hidden');
      updateBossHealthBar();
    }
    
    // 更新BOSS血条
    function updateBossHealthBar() {
      if (!gameData.currentBoss) return;
      const healthPercentage = Math.max(0, (gameData.currentBoss.health / gameData.currentBoss.maxHealth) * 100);
      bossHealthFill.style.width = `${healthPercentage}%`;
      bossHealthText.textContent = `BOSS: ${Math.floor(gameData.currentBoss.health)}/${Math.floor(gameData.currentBoss.maxHealth)}`;
    }
    
    // 处理画布点击
    function handleCanvasClick(event) {
      if (gameData.gameState !== 'game' || gameData.isGameOver || gameData.isVictory) return;
      
      const rect = gameCanvas.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      
      const gridX = Math.floor((x - gameData.gridOffset.x) / gameData.cellSize);
      const gridY = Math.floor((y - gameData.gridOffset.y) / gameData.cellSize);
      
      if (gridX >= 0 && gridX < gameData.gridSize.width && gridY >= 0 && gridY < gameData.gridSize.height) {
        // 加农炮目标选择
        if (gameData.isHowitzerTargeting && gameData.selectedHowitzer) {
          handleHowitzerTargetSelection(gridX, gridY);
          return;
        }
        
        // 点击已有炮塔
        const clickedTower = gameData.towers.find(t => t.position.x === gridX && t.position.y === gridY);
        if (clickedTower) {
          showTowerInfo(clickedTower);
          return;
        }
        
        // 放置炮塔
        if (gameData.selectedTower) {
          placeTower(gridX, gridY);
        }
      }
    }
    
    // 处理加农炮目标选择
    function handleHowitzerTargetSelection(gridX, gridY) {
      if (gameData.selectedTargetCell?.x === gridX && gameData.selectedTargetCell?.y === gridY) {
        fireHowitzer(gameData.selectedHowitzer, gridX, gridY);
        gameData.isHowitzerTargeting = false;
        gameData.selectedHowitzer = null;
        gameData.selectedTargetCell = null;
      } else {
        gameData.selectedTargetCell = { x: gridX, y: gridY };
        showFloatingText(gridX, gridY, '点击确认发射', '#F59E0B', 2);
      }
    }
    
    // 发射加农炮
    function fireHowitzer(tower, targetX, targetY) {
      tower.cooldown = tower.fireRate;
      const projectile = {
        type: 'howitzer',
        towerType: 'howitzer',
        damage: tower.damage,
        position: { ...tower.position },
        target: { x: targetX, y: targetY },
        speed: 3,
        tower: tower
      };
      gameData.projectiles.push(projectile);
      showFloatingText(tower.position.x, tower.position.y, '发射！', '#F59E0B');
    }
    
    // 处理画布鼠标移动
    function handleCanvasMouseMove(event) {
      if (gameData.gameState !== 'game' || gameData.isGameOver || gameData.isVictory) return;
      
      const rect = gameCanvas.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      
      const gridX = Math.floor((x - gameData.gridOffset.x) / gameData.cellSize);
      const gridY = Math.floor((y - gameData.gridOffset.y) / gameData.cellSize);
      
      gameData.selectedCell = (gridX >= 0 && gridX < gameData.gridSize.width && gridY >= 0 && gridY < gameData.gridSize.height)
        ? { x: gridX, y: gridY }
        : null;
    }
    
    // 放置炮塔
    function placeTower(x, y) {
      if (gameData.blockedCells.has(`${x},${y}`)) {
        showFloatingText(x, y, '禁止放置！', '#EF4444');
        return;
      }
      
      const towerExists = gameData.towers.some(t => t.position.x === x && t.position.y === y);
      if (towerExists) {
        showFloatingText(x, y, '已有炮塔！', '#EF4444');
        return;
      }
      
      const towerData = gameData.towerTypes.find(t => t.id === gameData.selectedTower);
      if (!towerData) return;
      
      if (gameData.money < towerData.price) {
        showFloatingText(x, y, '金钱不足！', '#EF4444');
        return;
      }
      
      const tower = {
        id: `tower-${Date.now()}`,
        type: towerData.id,
        name: towerData.name,
        range: towerData.range,
        damage: towerData.damage,
        fireRate: towerData.fireRate,
        price: towerData.price,
        special: towerData.special,
        position: { x, y },
        level: 1,
        fireTimer: 0,
        isFrozen: false,
        frozenTimer: 0,
        isProtectedByFlame: false,
        cooldown: 0
      };
      
      gameData.money -= towerData.price;
      updateGameInfo();
      gameData.towers.push(tower);
      gameData.blockedCells.add(`${x},${y}`);
      soundManager.playSound('towerPlaceSound');
    }
    
    // 显示炮塔信息
    function showTowerInfo(tower) {
      towerInfoName.textContent = tower.name;
      towerInfoLevel.textContent = tower.level;
      towerInfoRange.textContent = tower.range;
      towerInfoDamage.textContent = tower.damage;
      towerInfoFireRate.textContent = tower.fireRate;
      towerInfoSpecial.textContent = tower.special;
      
      const upgradeCostValue = Math.floor(tower.price * tower.level / 4);
      upgradeCost.textContent = upgradeCostValue;
      sellAmount.textContent = Math.floor(tower.price * 0.5);
      
      gameData.selectedTower = tower;
      towerInfoScreen.classList.remove('hidden');
      
      // 加农炮发射按钮
      const towerInfoButtons = document.querySelector('.tower-info-buttons');
      let fireButton = $('fire-howitzer');
      
      if (tower.type === 'howitzer') {
        if (!fireButton) {
          fireButton = document.createElement('div');
          fireButton.id = 'fire-howitzer';
          fireButton.className = 'tower-info-button fire-button';
          towerInfoButtons.appendChild(fireButton);
        }
        if (tower.cooldown <= 0) {
          fireButton.textContent = '发射';
          fireButton.style.cursor = 'pointer';
          fireButton.onclick = (e) => {
            e.stopPropagation();
            startHowitzerTargeting(tower);
          };
        } else {
          fireButton.textContent = `冷却中: ${Math.ceil(tower.cooldown)}秒`;
          fireButton.style.cursor = 'not-allowed';
          fireButton.onclick = null;
        }
      } else if (fireButton) {
        fireButton.remove();
      }
    }
    
    // 关闭炮塔信息界面
    function closeTowerInfo() {
      towerInfoScreen.classList.add('hidden');
      gameData.selectedTower = null;
      gameData.isHowitzerTargeting = false;
      gameData.selectedHowitzer = null;
      gameData.selectedTargetCell = null;
      const fireButton = $('fire-howitzer');
      fireButton?.remove();
    }
    
    // 开始加农炮目标选择
    function startHowitzerTargeting(tower) {
      if (tower.cooldown > 0) return;
      closeTowerInfo();
      gameData.isHowitzerTargeting = true;
      gameData.selectedHowitzer = tower;
      gameData.selectedTargetCell = null;
      showFloatingText(tower.position.x, tower.position.y - 2, '请选择目标格子', '#F59E0B', 3);
    }
    
    // 升级炮塔
    function upgradeTower() {
      if (!gameData.selectedTower) return;
      const tower = gameData.selectedTower;
      const upgradeCostValue = Math.floor(tower.price * tower.level / 4);
      
      if (gameData.money < upgradeCostValue) {
        alert('金钱不足！');
        return;
      }
      
      gameData.money -= upgradeCostValue;
      updateGameInfo();
      tower.level++;
      
      // 升级属性
      if (tower.type === 'laser') {
        tower.damage = Math.floor(tower.damage + 0.5 * tower.level);
        tower.fireRate = Math.max(0.01, tower.fireRate * 0.85);
      } else {
        tower.damage = Math.floor(tower.damage * 1.5);
        tower.range = Math.floor(tower.range * 1.1);
        tower.fireRate = Math.max(0.1, tower.fireRate * 0.9);
      }
      
      showTowerInfo(tower);
      soundManager.playSound('towerUpgradeSound');
    }
    
    // 出售炮塔
    function sellTower() {
      if (!gameData.selectedTower) return;
      const tower = gameData.selectedTower;
      const sellAmountValue = Math.floor(tower.price * 0.5);
      
      gameData.money += sellAmountValue;
      updateGameInfo();
      gameData.blockedCells.delete(`${tower.position.x},${tower.position.y}`);
      
      const index = gameData.towers.indexOf(tower);
      if (index !== -1) gameData.towers.splice(index, 1);
      
      towerInfoScreen.classList.add('hidden');
      gameData.selectedTower = null;
    }
    
    // 更新游戏信息
    function updateGameInfo() {
      difficultyDisplay.textContent = `难度: ${getDifficultyName(gameData.difficulty)}`;
      const { endlessMode, maxBaseWave, bossWave } = gameData.waveSettings;
      waveDisplay.textContent = endlessMode && gameData.currentWave > maxBaseWave 
        ? `波数: ${gameData.currentWave} (无尽)` 
        : `波数: ${gameData.currentWave}/${bossWave}`;
      moneyDisplay.textContent = `金钱: ${gameData.money}`;
      coreHealthDisplay.textContent = `核心血量: ${gameData.coreHealth}`;
    }
    
    // 获取难度名称
    function getDifficultyName(difficulty) {
      const names = { easy: '简单', normal: '普通', hard: '困难', hell: '地狱' };
      return names[difficulty] || '未知';
    }
    
    // 显示浮动文本
    function showFloatingText(gridX, gridY, text, color, duration = 1) {
      const x = gameData.gridOffset.x + gridX * gameData.cellSize + gameData.cellSize / 2;
      const y = gameData.gridOffset.y + gridY * gameData.cellSize + gameData.cellSize / 2;
      gameData.floatingTexts.push({ x, y, text, color, time: 0, duration });
    }
    
    // 创建爆炸效果
    function createExplosion(gridX, gridY, radius) {
      const x = gameData.gridOffset.x + gridX * gameData.cellSize + gameData.cellSize / 2;
      const y = gameData.gridOffset.y + gridY * gameData.cellSize + gameData.cellSize / 2;
      gameData.explosions.push({ x, y, radius: radius * gameData.cellSize, time: 0 });
    }
    
    // 创建激光效果
    function createLaser(startX, startY, endX, endY) {
      const dx = endX - startX;
      const dy = endY - startY;
      const length = Math.sqrt(dx * dx + dy * dy);
      const angle = Math.atan2(dy, dx);
      
      gameData.effects.push({
        type: 'laser',
        x: startX,
        y: startY,
        length,
        angle,
        time: 0
      });
    }
    
    // 创建冻结效果
    function createFreezeEffect(gridX, gridY) {
      const x = gameData.gridOffset.x + gridX * gameData.cellSize + gameData.cellSize / 2;
      const y = gameData.gridOffset.y + gridY * gameData.cellSize + gameData.cellSize / 2;
      gameData.effects.push({ type: 'freeze', x, y, size: gameData.cellSize, time: 0 });
    }
    
    // 创建眩晕效果
    function createStunEffect(gridX, gridY) {
      const x = gameData.gridOffset.x + gridX * gameData.cellSize + gameData.cellSize / 2;
      const y = gameData.gridOffset.y + gridY * gameData.cellSize + gameData.cellSize / 2;
      gameData.effects.push({ type: 'stun', x, y, size: gameData.cellSize, time: 0 });
    }
    
    // 游戏循环
    function gameLoop(timestamp) {
      if (!gameData.lastTime) gameData.lastTime = timestamp;
      gameData.deltaTime = Math.min(0.1, (timestamp - gameData.lastTime) / 1000); // 限制最大deltaTime，防止卡顿后瞬移
      gameData.lastTime = timestamp;
      
      ctx.clearRect(0, 0, gameCanvas.width, gameCanvas.height);
      
      if (gameData.gameState === 'game') {
        updateGame();
        renderGame();
      }
      
      requestAnimationFrame(gameLoop);
    }
    
    // 更新游戏
    function updateGame() {
      if (gameData.isGameOver || gameData.isVictory) return;
      
      // UI更新节流
      gameData.uiUpdateTimer += gameData.deltaTime;
      if (gameData.uiUpdateTimer >= 0.1) {
        if (gameData.selectedTower && !towerInfoScreen.classList.contains('hidden')) {
          showTowerInfo(gameData.selectedTower);
        }
        gameData.uiUpdateTimer = 0;
      }
      
      // 波次结束判断
      if (gameData.isWaveActive && gameData.monsters.length === 0) {
        gameData.isWaveActive = false;
        gameData.waveStartTime = Date.now();
        
        if (gameData.currentWave === gameData.waveSettings.bossWave) {
          gameData.isVictory = true;
          changeGameState('victory');
          return;
        }
        
        gameData.currentWave++;
      }
      
      // 下一波倒计时
      if (!gameData.isWaveActive && Date.now() - gameData.waveStartTime >= gameData.waveDelay) {
        startWave();
      }
      
      // 更新游戏对象
      updateTowers();
      updateMonsters();
      updateProjectiles();
      updateExplosions();
      updateEffects();
      updateFloatingTexts();
      
      // 游戏结束判断
      if (gameData.coreHealth <= 0) {
        gameData.isGameOver = true;
        changeGameState('game-over');
      }
    }
    
    // 处理烈火炮保护逻辑
    function handleFlameTowerProtection() {
      // 先清除所有保护标记
      gameData.towers.forEach(tower => tower.isProtectedByFlame = false);
      
      // 找出活跃的烈火炮
      const activeFlameTowers = gameData.towers.filter(tower => 
        tower.type === 'flame' && !tower.isFrozen
      );
      
      // 设置保护标记
      activeFlameTowers.forEach(flameTower => {
        const { x, y } = flameTower.position;
        for (let dx = -1; dx <= 1; dx++) {
          for (let dy = -1; dy <= 1; dy++) {
            const targetX = x + dx;
            const targetY = y + dy;
            const protectedTower = gameData.towers.find(tower => 
              tower.position.x === targetX && tower.position.y === targetY
            );
            if (protectedTower) protectedTower.isProtectedByFlame = true;
          }
        }
      });
    }
    
    // 更新炮塔
    function updateTowers() {
      handleFlameTowerProtection();
      
      gameData.towers.forEach(tower => {
        // 烈火炮解冻逻辑
        if (tower.type === 'flame' && tower.isFrozen && tower.frozenTimer > 0) {
          tower.frozenTimer -= gameData.deltaTime;
          if (tower.frozenTimer <= 0) {
            tower.isFrozen = false;
            tower.frozenTimer = 0;
          }
        }
        
        if (tower.isFrozen) return;
        
        // 加农炮冷却
        if (tower.type === 'howitzer' && tower.cooldown !== undefined) {
          tower.cooldown = Math.max(0, tower.cooldown - gameData.deltaTime);
        }
        
        // 攻击计时器（精准计时，避免帧率影响）
        tower.fireTimer += gameData.deltaTime;
        if (tower.fireTimer >= tower.fireRate) {
          const target = findTarget(tower);
          if (target) {
            shootTarget(tower, target);
            tower.fireTimer -= tower.fireRate; // 累计计时，避免帧率波动
          }
        }
      });
    }
    
    // 寻找目标
    function findTarget(tower) {
      let target = null;
      let maxPathIndex = -1;
      
      for (const monster of gameData.monsters) {
        // 防空炮只攻击无人机
        if (tower.type === 'anti-air' && monster.type !== 'drone') continue;
        
        const dx = monster.position.x - tower.position.x;
        const dy = monster.position.y - tower.position.y;
        const distance = Math.sqrt(dx * dx + dy * dy);
        
        // 优先选择路径最靠前的怪物
        if (distance <= tower.range && monster.pathIndex > maxPathIndex) {
          maxPathIndex = monster.pathIndex;
          target = monster;
        }
      }
      
      return target;
    }
    
    // 射击目标
    function shootTarget(tower, target) {
      switch (tower.type) {
        case 'energy':
        case 'rapid':
        case 'ice':
        case 'titan':
        case 'sniper':
          createProjectile(tower, target);
          break;
        case 'anti-air':
          createAAProjectile(tower, target);
          break;
        case 'pierce':
          createPierceProjectile(tower, target);
          break;
        case 'laser':
          createLaserEffect(tower);
          break;
        case 'rocket':
          createRocketProjectile(tower, target);
          break;
        case 'electro':
          createElectroProjectile(tower, target);
          break;
        case 'flame':
          createProjectile(tower, target);
          break;
      }
    }
    
    // 创建普通炮弹
    function createProjectile(tower, target) {
      gameData.projectiles.push({
        type: 'normal',
        towerType: tower.type,
        damage: tower.damage,
        position: { ...tower.position },
        target: { ...target.position },
        speed: 10,
        tower: tower
      });
    }
    
    // 创建穿透炮弹
    function createPierceProjectile(tower, target) {
      const dx = target.position.x - tower.position.x;
      const dy = target.position.y - tower.position.y;
      const distance = Math.sqrt(dx * dx + dy * dy);
      
      gameData.projectiles.push({
        type: 'pierce',
        towerType: tower.type,
        damage: tower.damage,
        position: { ...tower.position },
        direction: { x: dx / distance, y: dy / distance },
        speed: 8,
        distance: 0,
        maxDistance: tower.range,
        tower: tower
      });
    }
    
    // 创建激光效果
    function createLaserEffect(tower) {
      const target = findTarget(tower);
      if (!target) return;
      
      const startX = gameData.gridOffset.x + tower.position.x * gameData.cellSize + gameData.cellSize / 2;
      const startY = gameData.gridOffset.y + tower.position.y * gameData.cellSize + gameData.cellSize / 2;
      const endX = gameData.gridOffset.x + target.position.x * gameData.cellSize + gameData.cellSize / 2;
      const endY = gameData.gridOffset.y + target.position.y * gameData.cellSize + gameData.cellSize / 2;
      
      createLaser(startX, startY, endX, endY);
      damageMonster(target, tower.damage);
      
      // 穿透伤害
      const dx = target.position.x - tower.position.x;
      const dy = target.position.y - tower.position.y;
      const distance = Math.sqrt(dx * dx + dy * dy);
      const direction = { x: dx / distance, y: dy / distance };
      
      gameData.monsters.forEach(monster => {
        if (monster === target) return;
        const mx = monster.position.x - tower.position.x;
        const my = monster.position.y - tower.position.y;
        const dot = mx * direction.x + my * direction.y;
        if (dot < 0 || dot > tower.range) return;
        
        const cross = mx * direction.y - my * direction.x;
        if (Math.abs(cross) < 0.5) {
          damageMonster(monster, tower.damage);
        }
      });
    }
    
    // 创建火箭弹
    function createRocketProjectile(tower, target) {
      gameData.projectiles.push({
        type: 'rocket',
        towerType: tower.type,
        damage: tower.damage,
        position: { ...tower.position },
        target: { ...target.position },
        speed: 5,
        tower: tower
      });
    }
    
    // 创建电磁弹
    function createElectroProjectile(tower, target) {
      gameData.projectiles.push({
        type: 'electro',
        towerType: tower.type,
        damage: tower.damage,
        position: { ...tower.position },
        target: { ...target.position },
        speed: 7,
        tower: tower
      });
    }
    
    // 创建防空炮弹
    function createAAProjectile(tower, target) {
      gameData.projectiles.push({
        type: 'aa',
        towerType: tower.type,
        damage: tower.damage,
        position: { ...tower.position },
        target: { ...target.position },
        speed: 15,
        tower: tower
      });
    }
    
    // 更新炮弹
    function updateProjectiles() {
      for (let i = gameData.projectiles.length - 1; i >= 0; i--) {
        const projectile = gameData.projectiles[i];
        
        switch (projectile.type) {
          case 'normal':
          case 'rocket':
          case 'electro':
          case 'aa':
          case 'howitzer':
            const dx = projectile.target.x - projectile.position.x;
            const dy = projectile.target.y - projectile.position.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            if (distance < 0.1) {
              handleProjectileHit(projectile);
              gameData.projectiles.splice(i, 1);
            } else {
              const speed = projectile.speed * gameData.deltaTime;
              projectile.position.x += (dx / distance) * speed;
              projectile.position.y += (dy / distance) * speed;
              
              // 追踪弹更新目标
              if (['rocket', 'electro', 'aa'].includes(projectile.type)) {
                const target = findTarget(projectile.tower);
                if (target) projectile.target = { ...target.position };
              }
            }
            break;
            
          case 'pierce':
            projectile.position.x += projectile.direction.x * projectile.speed * gameData.deltaTime;
            projectile.position.y += projectile.direction.y * projectile.speed * gameData.deltaTime;
            projectile.distance += projectile.speed * gameData.deltaTime;
            
            if (projectile.distance >= projectile.maxDistance) {
              gameData.projectiles.splice(i, 1);
              continue;
            }
            
            // 穿透命中
            for (const monster of gameData.monsters) {
              const dx = monster.position.x - projectile.position.x;
              const dy = monster.position.y - projectile.position.y;
              const distance = Math.sqrt(dx * dx + dy * dy);
              
              if (distance < 0.5) {
                damageMonster(monster, projectile.damage);
              }
            }
            break;
        }
      }
    }
    
    // 处理炮弹命中
    function handleProjectileHit(projectile) {
      // BOSS火箭弹
      if (projectile.isBossRocket) {
        for (let j = gameData.towers.length - 1; j >= 0; j--) {
          const tower = gameData.towers[j];
          const dx = tower.position.x - projectile.position.x;
          const dy = tower.position.y - projectile.position.y;
          if (Math.sqrt(dx * dx + dy * dy) <= 0.5) {
            gameData.blockedCells.delete(`${tower.position.x},${tower.position.y}`);
            gameData.towers.splice(j, 1);
          }
        }
        createExplosion(projectile.position.x, projectile.position.y, 1.5);
        gameData.monsters.forEach(monster => {
          const dx = monster.position.x - projectile.position.x;
          const dy = monster.position.y - projectile.position.y;
          if (Math.sqrt(dx * dx + dy * dy) <= 1.5) {
            damageMonster(monster, projectile.damage);
          }
        });
        return;
      }
      
      switch (projectile.type) {
        case 'normal':
          const targetMonster = findClosestMonster(projectile.position.x, projectile.position.y, 0.5);
          if (targetMonster) {
            damageMonster(targetMonster, projectile.damage);
            
            // 冰锥炮减速
            if (projectile.towerType === 'ice' && !targetMonster.isSlowed && targetMonster.type !== 'mech') {
              targetMonster.isSlowed = true;
              targetMonster.originalSpeed = targetMonster.speed;
              targetMonster.speed *= 0.5;
              targetMonster.slowDuration = 5;
              createFreezeEffect(targetMonster.position.x, targetMonster.position.y);
            }
            
            // 狙击炮暴击
            if (projectile.towerType === 'sniper' && Math.random() < 0.25) {
              damageMonster(targetMonster, projectile.damage);
              showFloatingText(targetMonster.position.x, targetMonster.position.y, '暴击!', '#F59E0B');
            }
          }
          break;
          
        case 'rocket':
          createExplosion(projectile.position.x, projectile.position.y, 0.3);
          gameData.monsters.forEach(monster => {
            const dx = monster.position.x - projectile.position.x;
            const dy = monster.position.y - projectile.position.y;
            if (Math.sqrt(dx * dx + dy * dy) <= 0.3) {
              damageMonster(monster, projectile.damage);
            }
          });
          break;
          
        case 'electro':
          createExplosion(projectile.position.x, projectile.position.y, 0.2);
          gameData.monsters.forEach(monster => {
            const dx = monster.position.x - projectile.position.x;
            const dy = monster.position.y - projectile.position.y;
            if (Math.sqrt(dx * dx + dy * dy) <= 0.2) {
              damageMonster(monster, projectile.damage);
              if (!monster.isStunned && monster.type !== 'mech') {
                monster.isStunned = true;
                monster.stunDuration = 1;
                createStunEffect(monster.position.x, monster.position.y);
              }
            }
          });
          break;
          
        case 'howitzer':
          createExplosion(projectile.position.x, projectile.position.y, 3);
          gameData.monsters.forEach(monster => {
            const dx = Math.abs(monster.position.x - projectile.position.x);
            const dy = Math.abs(monster.position.y - projectile.position.y);
            if (dx <= 3 && dy <= 3) {
              damageMonster(monster, projectile.damage);
              showFloatingText(monster.position.x, monster.position.y, `-${projectile.damage}`, '#EF4444');
            }
          });
          showFloatingText(projectile.position.x, projectile.position.y, '超大范围伤害!', '#F59E0B', 2);
          break;
          
        case 'aa':
          const aaTarget = findClosestMonster(projectile.position.x, projectile.position.y, 0.5);
          if (aaTarget && aaTarget.type === 'drone') {
            damageMonster(aaTarget, projectile.damage);
          }
          break;
      }
    }
    
    // 寻找最近的怪物
    function findClosestMonster(x, y, radius) {
      let closest = null;
      let closestDist = Infinity;
      
      gameData.monsters.forEach(monster => {
        const dx = monster.position.x - x;
        const dy = monster.position.y - y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < closestDist && dist <= radius) {
          closestDist = dist;
          closest = monster;
        }
      });
      
      return closest;
    }
    
    // 更新怪物
    function updateMonsters() {
      // 预缓存盾牌怪物
      gameData.shieldMonsters = gameData.monsters.filter(m => m.type === 'shield' && m.health > 0);
      
      for (let i = gameData.monsters.length - 1; i >= 0; i--) {
        const monster = gameData.monsters[i];
        
        // 死亡处理
        if (monster.health <= 0) {
          gameData.monsters.splice(i, 1);
          const money = gameData.difficultySettings[gameData.difficulty].moneyPerKill;
          const finalMoney = monster.isElite ? money * gameData.waveSettings.eliteMonsterRewardMultiplier : money;
          gameData.money += finalMoney;
          updateGameInfo();
          showFloatingText(monster.position.x, monster.position.y, `+${finalMoney}`, '#10B981');
          soundManager.playSound('enemyDieSound');
          
          if (monster.type === gameData.waveSettings.bossMonster) {
            bossHealthBar.classList.add('hidden');
            bossHealthText.classList.add('hidden');
            gameData.currentBoss = null;
          }
          continue;
        }
        
        // 状态效果处理
        if (monster.isStunned) {
          monster.stunDuration -= gameData.deltaTime;
          if (monster.stunDuration <= 0) monster.isStunned = false;
          else continue;
        }
        
        if (monster.isSlowed) {
          monster.slowDuration -= gameData.deltaTime;
          if (monster.slowDuration <= 0) {
            monster.isSlowed = false;
            monster.speed = monster.originalSpeed;
          }
        }
        
        if (monster.isInvulnerable) {
          monster.invulnerableDuration -= gameData.deltaTime;
          if (monster.invulnerableDuration <= 0) {
            monster.isInvulnerable = false;
            if (monster.originalSpeed !== undefined) {
              monster.speed = monster.originalSpeed;
              monster.originalSpeed = undefined;
            }
          }
        }
        
        // 特殊怪物逻辑
        if (monster.type === 'bomber') {
          monster.bomberTimer -= gameData.deltaTime;
          if (monster.bomberTimer <= 0 && !monster.isBomberActivated) {
            monster.isBomberActivated = true;
            createExplosion(monster.position.x, monster.position.y, 1.5);
            for (let j = gameData.towers.length - 1; j >= 0; j--) {
              const tower = gameData.towers[j];
              const dx = tower.position.x - monster.position.x;
              const dy = tower.position.y - monster.position.y;
              if (Math.sqrt(dx * dx + dy * dy) <= 1.5) {
                gameData.blockedCells.delete(`${tower.position.x},${tower.position.y}`);
                gameData.towers.splice(j, 1);
              }
            }
            gameData.monsters.splice(i, 1);
            continue;
          }
        } else if (monster.type === 'healer') {
          monster.healerTimer -= gameData.deltaTime;
          if (monster.healerTimer <= 0) {
            gameData.monsters.forEach(m => {
              if (m.health < m.maxHealth) m.health = Math.min(m.maxHealth, m.health + 15);
            });
            monster.healerTimer = 1;
          }
        } else if (monster.type === 'reaper') {
          monster.reaperTimer -= gameData.deltaTime;
          if (monster.reaperTimer <= 0) {
            const directions = [{ x:0,y:-1 }, { x:0,y:1 }, { x:-1,y:0 }, { x:1,y:0 }];
            const dir = directions[Math.floor(Math.random() * directions.length)];
            
            const startX = gameData.gridOffset.x + monster.position.x * gameData.cellSize + gameData.cellSize / 2;
            const startY = gameData.gridOffset.y + monster.position.y * gameData.cellSize + gameData.cellSize / 2;
            const endX = startX + dir.x * 3 * gameData.cellSize;
            const endY = startY + dir.y * 3 * gameData.cellSize;
            createLaser(startX, startY, endX, endY);
            
            // 摧毁路径上的炮塔
            for (let j = 1; j <= 3; j++) {
              const x = monster.position.x + dir.x * j;
              const y = monster.position.y + dir.y * j;
              for (let k = gameData.towers.length - 1; k >= 0; k--) {
                const tower = gameData.towers[k];
                if (tower.position.x === x && tower.position.y === y) {
                  gameData.blockedCells.delete(`${x},${y}`);
                  gameData.towers.splice(k, 1);
                  break;
                }
              }
            }
            monster.reaperTimer = 3;
          }
        } else if (monster.type === 'ice-mage') {
          monster.iceMageTimer -= gameData.deltaTime;
          if (monster.iceMageTimer <= 0 && gameData.towers.length > 0) {
            const availableTowers = gameData.towers.filter(t => !t.isFrozen && !t.isProtectedByFlame);
            if (availableTowers.length > 0) {
              const tower = availableTowers[Math.floor(Math.random() * availableTowers.length)];
              if (tower.type === 'flame') {
                tower.isFrozen = true;
                tower.frozenTimer = 10;
              } else {
                tower.isFrozen = true;
              }
              createFreezeEffect(tower.position.x, tower.position.y);
            }
            monster.iceMageTimer = 3;
          }
        } else if (monster.type === gameData.waveSettings.bossMonster) {
          // BOSS召唤怪物
          monster.summonTimer -= gameData.deltaTime;
          if (monster.summonTimer <= 0 && gameData.monsters.length < 30) {
            const monsterType = gameData.waveSettings.allMonsters[Math.floor(Math.random() * gameData.waveSettings.allMonsters.length)];
            const monsterData = gameData.monsterTypes.find(m => m.id === monsterType);
            const diff = gameData.difficultySettings[gameData.difficulty];
            const newMonster = {
              id: `monster-${Date.now()}-${gameData.monsters.length}`,
              type: monsterType,
              name: monsterData.name,
              health: monsterData.health * diff.monsterHealthMultiplier,
              maxHealth: monsterData.health * diff.monsterHealthMultiplier,
              speed: monsterData.speed * diff.monsterSpeedMultiplier,
              coreDamage: monsterData.coreDamage * diff.monsterCoreDamageMultiplier,
              reward: monsterData.reward,
              position: { ...monster.position },
              pathIndex: monster.pathIndex,
              progress: 0,
              isFlying: monsterType === 'drone',
              isStunned: false,
              isSlowed: false,
              slowDuration: 0,
              isInvulnerable: false,
              invulnerableDuration: 0,
              isBomberActivated: false,
              bomberTimer: 5,
              healerTimer: 0,
              reaperTimer: 0,
              iceMageTimer: 0
            };
            gameData.monsters.push(newMonster);
            monster.summonTimer = 8;
          }
          
          // BOSS发射火箭弹
          monster.rocketTimer -= gameData.deltaTime;
          if (monster.rocketTimer <= 0 && gameData.towers.length > 0) {
            const rocketCount = gameData.towers.length > 5 ? 2 : 1;
            const targetTowers = [];
            const availableTowers = [...gameData.towers];
            for (let j = 0; j < rocketCount && availableTowers.length > 0; j++) {
              const index = Math.floor(Math.random() * availableTowers.length);
              targetTowers.push(availableTowers[index]);
              availableTowers.splice(index, 1);
            }
            targetTowers.forEach(tower => {
              gameData.projectiles.push({
                type: 'rocket',
                towerType: 'rocket',
                damage: 1000,
                position: { ...monster.position },
                target: { ...tower.position },
                speed: 3,
                isBossRocket: true
              });
            });
            monster.rocketTimer = 8;
          }
          
          // BOSS血条更新
          gameData.lastBossHealthUpdate += gameData.deltaTime;
          if (gameData.lastBossHealthUpdate >= 0.2) {
            updateBossHealthBar();
            gameData.lastBossHealthUpdate = 0;
          }
        }
        
        // 怪物移动
        if (!monster.isStunned) {
          if (monster.isFlying) {
            const endPoint = gameData.path[gameData.path.length - 1];
            const dx = endPoint.x - monster.position.x;
            const dy = endPoint.y - monster.position.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            if (distance < 0.3) {
              damageCore(monster.coreDamage);
              gameData.monsters.splice(i, 1);
            } else {
              const speed = monster.speed * gameData.deltaTime * 0.15;
              monster.position.x += (dx / distance) * speed;
              monster.position.y += (dy / distance) * speed;
            }
          } else {
            if (monster.pathIndex < gameData.path.length - 1) {
              const currentPoint = gameData.path[monster.pathIndex];
              const nextPoint = gameData.path[monster.pathIndex + 1];
              const dx = nextPoint.x - currentPoint.x;
              const dy = nextPoint.y - currentPoint.y;
              const distance = Math.sqrt(dx * dx + dy * dy);
              
              monster.progress += monster.speed * gameData.deltaTime * 0.15;
              if (monster.progress >= distance) {
                monster.pathIndex++;
                monster.progress = 0;
              } else {
                const ratio = monster.progress / distance;
                monster.position.x = currentPoint.x + dx * ratio;
                monster.position.y = currentPoint.y + dy * ratio;
              }
            } else {
              damageCore(monster.coreDamage);
              gameData.monsters.splice(i, 1);
            }
          }
        }
      }
    }
    
    // 伤害怪物
    function damageMonster(monster, damage) {
      if (monster.isInvulnerable) return;
      
      // 盾牌免伤
      let isProtected = false;
      if (monster.type !== 'shield' && gameData.shieldMonsters.length > 0) {
        for (const shield of gameData.shieldMonsters) {
          const dx = monster.position.x - shield.position.x;
          const dy = monster.position.y - shield.position.y;
          if (Math.sqrt(dx * dx + dy * dy) <= 1) {
            isProtected = true;
            break;
          }
        }
      }
      
      const finalDamage = isProtected ? damage * 0.1 : damage;
      monster.health = Math.max(0, monster.health - finalDamage);
      
      // 冲锋兵加速
      if (monster.type === 'charger' && !monster.isCharging) {
        monster.isCharging = true;
        monster.originalSpeed = monster.speed;
        monster.speed = 6;
      }
      
      // 刺客无敌
      if (monster.type === 'assassin' && !monster.isInvulnerable && (!monster.invulnerableCooldown || monster.invulnerableCooldown <= 0)) {
        monster.isInvulnerable = true;
        monster.invulnerableDuration = 5;
        monster.invulnerableCooldown = 15;
        monster.originalSpeed = monster.speed;
        monster.speed = 8;
      }
      
      soundManager.playSound('enemyHitSound');
    }
    
    // 伤害核心
    function damageCore(amount) {
      gameData.coreHealth = Math.max(0, gameData.coreHealth - amount);
      updateGameInfo();
      const endPoint = gameData.path[gameData.path.length - 1];
      showFloatingText(endPoint.x, endPoint.y, `-${amount}`, '#EF4444');
    }
    
    // 更新爆炸效果
    function updateExplosions() {
      for (let i = gameData.explosions.length - 1; i >= 0; i--) {
        const explosion = gameData.explosions[i];
        explosion.time += gameData.deltaTime;
        if (explosion.time >= 0.5) gameData.explosions.splice(i, 1);
      }
    }
    
    // 更新特效
    function updateEffects() {
      for (let i = gameData.effects.length - 1; i >= 0; i--) {
        const effect = gameData.effects[i];
        effect.time += gameData.deltaTime;
        if ((effect.type === 'laser' && effect.time >= 0.3) || effect.time >= 1) {
          gameData.effects.splice(i, 1);
        }
      }
    }
    
    // 更新浮动文本
    function updateFloatingTexts() {
      for (let i = gameData.floatingTexts.length - 1; i >= 0; i--) {
        const text = gameData.floatingTexts[i];
        text.time += gameData.deltaTime;
        text.y -= 30 * gameData.deltaTime;
        if (text.time >= (text.duration || 1)) gameData.floatingTexts.splice(i, 1);
      }
    }
    
    // 渲染游戏
    function renderGame() {
      renderGrid();
      renderPath();
      renderTowers();
      renderMonsters();
      renderProjectiles();
      renderExplosions();
      renderEffects();
      renderFloatingTexts();
      renderSelectedCell();
    }
    
    // 渲染网格
    function renderGrid() {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
      ctx.lineWidth = 1;
      
      for (let x = 0; x <= gameData.gridSize.width; x++) {
        ctx.beginPath();
        ctx.moveTo(gameData.gridOffset.x + x * gameData.cellSize, gameData.gridOffset.y);
        ctx.lineTo(gameData.gridOffset.x + x * gameData.cellSize, gameData.gridOffset.y + gameData.gridSize.height * gameData.cellSize);
        ctx.stroke();
      }
      
      for (let y = 0; y <= gameData.gridSize.height; y++) {
        ctx.beginPath();
        ctx.moveTo(gameData.gridOffset.x, gameData.gridOffset.y + y * gameData.cellSize);
        ctx.lineTo(gameData.gridOffset.x + gameData.gridSize.width * gameData.cellSize, gameData.gridOffset.y + y * gameData.cellSize);
        ctx.stroke();
      }
      
      // 禁止放置区域
      ctx.fillStyle = 'rgba(239, 68, 68, 0.2)';
      for (let x = 0; x < 3; x++) {
        for (let y = 0; y < 3; y++) {
          ctx.fillRect(
            gameData.gridOffset.x + x * gameData.cellSize,
            gameData.gridOffset.y + y * gameData.cellSize,
            gameData.cellSize,
            gameData.cellSize
          );
        }
      }
      for (let x = gameData.gridSize.width - 3; x < gameData.gridSize.width; x++) {
        for (let y = gameData.gridSize.height - 3; y < gameData.gridSize.height; y++) {
          ctx.fillRect(
            gameData.gridOffset.x + x * gameData.cellSize,
            gameData.gridOffset.y + y * gameData.cellSize,
            gameData.cellSize,
            gameData.cellSize
          );
        }
      }
    }
    
    // 渲染路径
    function renderPath() {
      ctx.fillStyle = 'rgba(107, 114, 128, 0.3)';
      gameData.path.forEach(point => {
        ctx.fillRect(
          gameData.gridOffset.x + point.x * gameData.cellSize,
          gameData.gridOffset.y + point.y * gameData.cellSize,
          gameData.cellSize,
          gameData.cellSize
        );
      });
      
      // 起点
      ctx.fillStyle = 'rgba(16, 185, 129, 0.7)';
      const startPoint = gameData.path[0];
      ctx.fillRect(
        gameData.gridOffset.x + startPoint.x * gameData.cellSize,
        gameData.gridOffset.y + startPoint.y * gameData.cellSize,
        gameData.cellSize,
        gameData.cellSize
      );
      ctx.fillStyle = 'white';
      ctx.font = '20px FontAwesome';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('\uf0d0', gameData.gridOffset.x + startPoint.x * gameData.cellSize + gameData.cellSize / 2, 
              gameData.gridOffset.y + startPoint.y * gameData.cellSize + gameData.cellSize / 2);
      
      // 终点
      ctx.fillStyle = 'rgba(239, 68, 68, 0.7)';
      const endPoint = gameData.path[gameData.path.length - 1];
      ctx.fillRect(
        gameData.gridOffset.x + endPoint.x * gameData.cellSize,
        gameData.gridOffset.y + endPoint.y * gameData.cellSize,
        gameData.cellSize,
        gameData.cellSize
      );
      ctx.fillStyle = 'white';
      ctx.font = '24px FontAwesome';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('\uf0e7', gameData.gridOffset.x + endPoint.x * gameData.cellSize + gameData.cellSize / 2, 
              gameData.gridOffset.y + endPoint.y * gameData.cellSize + gameData.cellSize / 2);
      
      ctx.fillStyle = 'white';
      ctx.font = '12px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText(`${gameData.coreHealth}/100`, 
              gameData.gridOffset.x + endPoint.x * gameData.cellSize + gameData.cellSize / 2, 
              gameData.gridOffset.y + endPoint.y * gameData.cellSize - 15);
    }
    
    // 渲染炮塔
    function renderTowers() {
      gameData.towers.forEach(tower => {
        const x = gameData.gridOffset.x + tower.position.x * gameData.cellSize;
        const y = gameData.gridOffset.y + tower.position.y * gameData.cellSize;
        
        // 底座
        ctx.fillStyle = '#374151';
        ctx.fillRect(x, y, gameData.cellSize, gameData.cellSize);
        
        // 主体颜色
        let towerColor = '#3B82F6';
        switch (tower.type) {
          case 'rapid': towerColor = '#10B981'; break;
          case 'ice': towerColor = '#60A5FA'; break;
          case 'pierce': towerColor = '#8B5CF6'; break;
          case 'laser': towerColor = '#EC4899'; break;
          case 'rocket': towerColor = '#EF4444'; break;
          case 'electro': towerColor = '#F59E0B'; break;
          case 'titan': towerColor = '#1F2937'; break;
          case 'sniper': towerColor = '#4B5563'; break;
          case 'anti-air': towerColor = '#3B82F6'; break;
          case 'flame': towerColor = '#F59E0B'; break;
          case 'howitzer': towerColor = '#DC2626'; break;
        }
        
        if (tower.isFrozen) towerColor = 'rgba(96, 165, 250, 0.7)';
        
        ctx.fillStyle = towerColor;
        ctx.beginPath();
        ctx.arc(x + gameData.cellSize / 2, y + gameData.cellSize / 2, gameData.cellSize / 3, 0, Math.PI * 2);
        ctx.fill();
        
        // 炮管
        ctx.fillStyle = '#1F2937';
        ctx.save();
        ctx.translate(x + gameData.cellSize / 2, y + gameData.cellSize / 2);
        
        let angle = 0;
        const target = findTarget(tower);
        if (target) {
          const dx = target.position.x - tower.position.x;
          const dy = target.position.y - tower.position.y;
          angle = Math.atan2(dy, dx);
        }
        
        ctx.rotate(angle);
        ctx.fillRect(gameData.cellSize / 3, -2, gameData.cellSize / 3, 4);
        ctx.restore();
        
        // 等级
        ctx.fillStyle = 'white';
        ctx.font = '12px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`Lv${tower.level}`, x + gameData.cellSize / 2, y + gameData.cellSize - 10);
        
        // 选中炮塔的射程
        if (gameData.selectedTower?.id === tower.id) {
          ctx.strokeStyle = 'rgba(59, 130, 246, 0.5)';
          ctx.lineWidth = 2;
          ctx.setLineDash([5, 5]);
          ctx.beginPath();
          ctx.arc(
            x + gameData.cellSize / 2,
            y + gameData.cellSize / 2,
            tower.range * gameData.cellSize,
            0,
            Math.PI * 2
          );
          ctx.stroke();
          ctx.setLineDash([]);
        }
      });
    }
    
    // 获取怪物边框颜色
    function getMonsterBorderColor(type, isElite) {
      if (isElite) return 'rgba(255, 215, 0, 0.9)';
      const colors = {
        normal: 'rgba(255, 255, 255, 0.7)',
        fast: 'rgba(255, 255, 0, 0.7)',
        heavy: 'rgba(128, 128, 128, 0.7)',
        shield: 'rgba(0, 255, 0, 0.7)',
        healer: 'rgba(255, 0, 255, 0.7)',
        drone: 'rgba(255, 165, 0, 0.7)',
        bomber: 'rgba(255, 0, 0, 0.7)',
        mech: 'rgba(0, 0, 255, 0.7)',
        thief: 'rgba(0, 255, 255, 0.7)',
        charger: 'rgba(255, 105, 180, 0.7)',
        assassin: 'rgba(128, 0, 128, 0.7)',
        reaper: 'rgba(0, 0, 0, 0.7)',
        'ice-mage': 'rgba(135, 206, 235, 0.7)',
        boss: 'rgba(128, 0, 0, 0.9)'
      };
      return colors[type] || 'rgba(255, 255, 255, 0.7)';
    }
    
    // 渲染怪物
    function renderMonsters() {
      gameData.monsters.forEach(monster => {
        const x = gameData.gridOffset.x + monster.position.x * gameData.cellSize;
        const y = gameData.gridOffset.y + monster.position.y * gameData.cellSize;
        
        // 怪物颜色
        let baseColor = '#9CA3AF';
        switch (monster.type) {
          case 'normal': baseColor = '#9CA3AF'; break;
          case 'fast': baseColor = '#10B981'; break;
          case 'heavy': baseColor = '#4B5563'; break;
          case 'shield': baseColor = '#3B82F6'; break;
          case 'healer': baseColor = '#8B5CF6'; break;
          case 'drone': baseColor = '#EC4899'; break;
          case 'bomber': baseColor = '#EF4444'; break;
          case 'mech': baseColor = '#1F2937'; break;
          case 'thief': baseColor = '#F59E0B'; break;
          case 'charger': baseColor = '#60A5FA'; break;
          case 'assassin': baseColor = '#8B5CF6'; break;
          case 'reaper': baseColor = '#1F2937'; break;
          case 'ice-mage': baseColor = '#60A5FA'; break;
          case 'boss': baseColor = '#7F1D1D'; break;
        }
        
        // 状态效果
        let fillColor = baseColor;
        if (monster.isSlowed) fillColor = 'rgba(96, 165, 250, 0.9)';
        if (monster.isStunned) fillColor = 'rgba(245, 158, 11, 0.9)';
        if (monster.isInvulnerable) {
          fillColor = Math.floor(monster.invulnerableDuration * 10) % 2 === 0 ? 'rgba(255, 255, 255, 0.9)' : baseColor;
        }
        
        ctx.fillStyle = fillColor;
        
        // 绘制怪物
        const radius = monster.isElite ? gameData.cellSize * 0.6 : gameData.cellSize * 0.5;
        ctx.beginPath();
        ctx.arc(x + gameData.cellSize / 2, y + gameData.cellSize / 2, radius, 0, Math.PI * 2);
        ctx.fill();
        
        // 边框
        ctx.strokeStyle = getMonsterBorderColor(monster.type, monster.isElite);
        ctx.lineWidth = monster.isElite ? 3 : 2;
        ctx.beginPath();
        ctx.arc(x + gameData.cellSize / 2, y + gameData.cellSize / 2, radius, 0, Math.PI * 2);
        ctx.stroke();
        
        // 精英标记
        if (monster.isElite) {
          ctx.fillStyle = 'gold';
          ctx.font = `${gameData.cellSize * 0.4}px Arial`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('★', x + gameData.cellSize / 2, y + gameData.cellSize / 2);
        }
        
        // 特殊标记
        if (monster.type === 'shield') {
          ctx.strokeStyle = 'white';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.rect(x + gameData.cellSize * 0.2, y + gameData.cellSize * 0.2, gameData.cellSize * 0.6, gameData.cellSize * 0.6);
          ctx.stroke();
        } else if (monster.type === 'bomber') {
          ctx.fillStyle = 'white';
          ctx.font = '10px Arial';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'bottom';
          ctx.fillText(`${Math.ceil(monster.bomberTimer)}`, x + gameData.cellSize / 2, y + gameData.cellSize * 0.8);
        }
        
        // 血条
        const healthPercentage = Math.max(0, monster.health / monster.maxHealth);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
        ctx.fillRect(x, y - 5, gameData.cellSize, 4);
        ctx.fillStyle = healthPercentage > 0.5 ? '#10B981' : healthPercentage > 0.25 ? '#F59E0B' : '#EF4444';
        ctx.fillRect(x, y - 5, gameData.cellSize * healthPercentage, 4);
        
        // 名称
        ctx.fillStyle = 'white';
        ctx.font = '8px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillText(monster.name, x + gameData.cellSize / 2, y + gameData.cellSize + 2);
      });
    }
    
    // 渲染炮弹
    function renderProjectiles() {
      gameData.projectiles.forEach(projectile => {
        const x = gameData.gridOffset.x + projectile.position.x * gameData.cellSize + gameData.cellSize / 2;
        const y = gameData.gridOffset.y + projectile.position.y * gameData.cellSize + gameData.cellSize / 2;
        
        switch (projectile.type) {
          case 'normal':
            ctx.fillStyle = '#3B82F6';
            ctx.beginPath();
            ctx.arc(x, y, 5, 0, Math.PI * 2);
            ctx.fill();
            break;
          case 'pierce':
            ctx.fillStyle = '#8B5CF6';
            ctx.save();
            ctx.translate(x, y);
            const angle = Math.atan2(projectile.direction.y, projectile.direction.x);
            ctx.rotate(angle);
            ctx.beginPath();
            ctx.moveTo(0, -3);
            ctx.lineTo(8, 0);
            ctx.lineTo(0, 3);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
            break;
          case 'rocket':
            ctx.fillStyle = '#EF4444';
            ctx.save();
            ctx.translate(x, y);
            const rocketAngle = Math.atan2(projectile.target.y - projectile.position.y, projectile.target.x - projectile.position.x);
            ctx.rotate(rocketAngle);
            ctx.beginPath();
            ctx.moveTo(0, -4);
            ctx.lineTo(10, 0);
            ctx.lineTo(0, 4);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#F59E0B';
            ctx.beginPath();
            ctx.moveTo(-5, -3);
            ctx.lineTo(0, 0);
            ctx.lineTo(-5, 3);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
            break;
          case 'electro':
            ctx.fillStyle = '#F59E0B';
            ctx.beginPath();
            ctx.arc(x, y, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#F59E0B';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(x, y, 8, 0, Math.PI * 2);
            ctx.stroke();
            break;
          case 'howitzer':
            ctx.fillStyle = '#DC2626';
            ctx.save();
            ctx.translate(x, y);
            const howitzerAngle = Math.atan2(projectile.target.y - projectile.position.y, projectile.target.x - projectile.position.x);
            ctx.rotate(howitzerAngle);
            ctx.beginPath();
            ctx.moveTo(0, -6);
            ctx.lineTo(12, 0);
            ctx.lineTo(0, 6);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#F59E0B';
            ctx.beginPath();
            ctx.moveTo(-8, -4);
            ctx.lineTo(0, 0);
            ctx.lineTo(-8, 4);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
            break;
          case 'aa':
            ctx.fillStyle = '#3B82F6';
            ctx.beginPath();
            ctx.arc(x, y, 4, 0, Math.PI * 2);
            ctx.fill();
            break;
        }
      });
    }
    
    // 渲染爆炸效果
    function renderExplosions() {
      gameData.explosions.forEach(explosion => {
        const alpha = 1 - explosion.time * 2;
        ctx.fillStyle = `rgba(245, 158, 11, ${alpha})`;
        ctx.beginPath();
        ctx.arc(explosion.x, explosion.y, explosion.radius * explosion.time * 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = `rgba(239, 68, 68, ${alpha * 0.7})`;
        ctx.beginPath();
        ctx.arc(explosion.x, explosion.y, explosion.radius * explosion.time * 1.5, 0, Math.PI * 2);
        ctx.fill();
      });
    }
    
    // 渲染特效
    function renderEffects() {
      gameData.effects.forEach(effect => {
        const alpha = 1 - effect.time;
        switch (effect.type) {
          case 'laser':
            ctx.strokeStyle = `rgba(59, 130, 246, ${alpha})`;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(effect.x, effect.y);
            ctx.lineTo(effect.x + Math.cos(effect.angle) * effect.length, effect.y + Math.sin(effect.angle) * effect.length);
            ctx.stroke();
            ctx.strokeStyle = `rgba(16, 185, 129, ${alpha * 0.5})`;
            ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.moveTo(effect.x, effect.y);
            ctx.lineTo(effect.x + Math.cos(effect.angle) * effect.length, effect.y + Math.sin(effect.angle) * effect.length);
            ctx.stroke();
            break;
          case 'freeze':
            ctx.fillStyle = `rgba(96, 165, 250, ${alpha * 0.3})`;
            ctx.beginPath();
            ctx.arc(effect.x, effect.y, effect.size * (0.5 + effect.time * 0.5), 0, Math.PI * 2);
            ctx.fill();
            break;
          case 'stun':
            ctx.fillStyle = `rgba(245, 158, 11, ${alpha * 0.3})`;
            ctx.beginPath();
            ctx.arc(effect.x, effect.y, effect.size * (0.5 + effect.time * 0.5), 0, Math.PI * 2);
            ctx.fill();
            break;
          case 'hit':
            ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.5})`;
            ctx.beginPath();
            ctx.arc(effect.x, effect.y, effect.size * 0.3 * (1 + effect.time), 0, Math.PI * 2);
            ctx.fill();
            break;
        }
      });
    }
    
    // 渲染浮动文本
    function renderFloatingTexts() {
      gameData.floatingTexts.forEach(text => {
        const alpha = 1 - text.time / (text.duration || 1);
        ctx.fillStyle = `${text.color}${Math.floor(alpha * 255).toString(16).padStart(2, '0')}`;
        ctx.font = 'bold 16px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text.text, text.x, text.y);
      });
    }
    
    // 渲染选中格子
    function renderSelectedCell() {
      // 加农炮目标选择
      if (gameData.isHowitzerTargeting && gameData.selectedTargetCell) {
        const centerX = gameData.gridOffset.x + gameData.selectedTargetCell.x * gameData.cellSize;
        const centerY = gameData.gridOffset.y + gameData.selectedTargetCell.y * gameData.cellSize;
        ctx.strokeStyle = 'rgba(245, 158, 11, 0.8)';
        ctx.lineWidth = 3;
        ctx.strokeRect(centerX - gameData.cellSize * 3, centerY - gameData.cellSize * 3, gameData.cellSize * 7, gameData.cellSize * 7);
        ctx.fillStyle = 'rgba(245, 158, 11, 0.3)';
        ctx.fillRect(centerX, centerY, gameData.cellSize, gameData.cellSize);
        ctx.strokeStyle = 'rgba(245, 158, 11, 0.5)';
        ctx.lineWidth = 2;
        ctx.strokeRect(centerX - gameData.cellSize, centerY - gameData.cellSize, gameData.cellSize * 3, gameData.cellSize * 3);
        return;
      }
      
      if (!gameData.selectedCell) return;
      const x = gameData.gridOffset.x + gameData.selectedCell.x * gameData.cellSize;
      const y = gameData.gridOffset.y + gameData.selectedCell.y * gameData.cellSize;
      
      // 格子边框颜色
      let strokeColor = 'rgba(255, 255, 255, 0.5)';
      if (gameData.blockedCells.has(`${gameData.selectedCell.x},${gameData.selectedCell.y}`)) {
        strokeColor = 'rgba(239, 68, 68, 0.8)';
      } else if (gameData.selectedTower && typeof gameData.selectedTower === 'string') {
        const towerData = gameData.towerTypes.find(t => t.id === gameData.selectedTower);
        strokeColor = towerData && gameData.money >= towerData.price ? 'rgba(16, 185, 129, 0.8)' : 'rgba(239, 68, 68, 0.8)';
      }
      
      ctx.strokeStyle = strokeColor;
      ctx.lineWidth = 3;
      ctx.strokeRect(x, y, gameData.cellSize, gameData.cellSize);
      
      // 炮塔预览和射程
      if (gameData.selectedTower && typeof gameData.selectedTower === 'string' && !gameData.blockedCells.has(`${gameData.selectedCell.x},${gameData.selectedCell.y}`)) {
        const towerData = gameData.towerTypes.find(t => t.id === gameData.selectedTower);
        if (towerData && gameData.money >= towerData.price) {
          // 炮塔预览
          let towerColor = '#3B82F6';
          switch (towerData.id) {
            case 'rapid': towerColor = '#10B981'; break;
            case 'ice': towerColor = '#60A5FA'; break;
            case 'pierce': towerColor = '#8B5CF6'; break;
            case 'laser': towerColor = '#EC4899'; break;
            case 'rocket': towerColor = '#EF4444'; break;
            case 'electro': towerColor = '#F59E0B'; break;
            case 'titan': towerColor = '#1F2937'; break;
            case 'sniper': towerColor = '#4B5563'; break;
            case 'anti-air': towerColor = '#3B82F6'; break;
            case 'flame': towerColor = '#F59E0B'; break;
            case 'howitzer': towerColor = '#DC2626'; break;
          }
          ctx.globalAlpha = 0.5;
          ctx.fillStyle = towerColor;
          ctx.beginPath();
          ctx.arc(x + gameData.cellSize / 2, y + gameData.cellSize / 2, gameData.cellSize / 3, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1.0;
          
          // 射程预览
          ctx.strokeStyle = 'rgba(16, 185, 129, 0.3)';
          ctx.lineWidth = 2;
          ctx.setLineDash([5, 5]);
          ctx.beginPath();
          ctx.arc(x + gameData.cellSize / 2, y + gameData.cellSize / 2, towerData.range * gameData.cellSize, 0, Math.PI * 2);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      }
    }
    
    // 初始化音量控制
    function initVolumeControls() {
      const musicToggle = $('music-toggle');
      const sfxToggle = $('sfx-toggle');
      const musicVolume = $('music-volume');
      const sfxVolume = $('sfx-volume');
      
      musicToggle.addEventListener('click', soundManager.toggleMusic.bind(soundManager));
      sfxToggle.addEventListener('click', soundManager.toggleSfx.bind(soundManager));
      musicVolume.addEventListener('input', (e) => soundManager.setMusicVolume(parseFloat(e.target.value)));
      sfxVolume.addEventListener('input', (e) => soundManager.setSfxVolume(parseFloat(e.target.value)));
      
      // 初始化滑块值
      musicVolume.value = soundManager.musicVolume;
      sfxVolume.value = soundManager.sfxVolume;
    }
    
    // 页面加载完成初始化
    document.addEventListener('DOMContentLoaded', () => {
      soundManager.init();
      initGame();
      initVolumeControls();
      
      const versionElement = document.createElement('div');
      versionElement.textContent = 'V5.8.3';
      versionElement.className = 'fixed bottom-2 right-2 text-xs text-gray-400';
      document.body.appendChild(versionElement);
    });
  </script>
</body>
</html>
