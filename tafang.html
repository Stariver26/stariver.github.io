    function generateMonsters() {
      gameData.monsters = [];
      gameData.hasThief = false;
      
      let availableMonsters = gameData.currentWave <= 10 
        ? gameData.waveSettings.baseMonsters 
        : gameData.waveSettings.allMonsters;
      
      // 无尽模式参数
      let waveMultiplier = 1;
      let monsterCountMultiplier = 1;
      let eliteChance = 0;
      if (gameData.waveSettings.endlessMode) {
        const waveOffset = Math.max(0, gameData.currentWave - gameData.waveSettings.maxBaseWave);
        waveMultiplier = 1 + waveOffset * gameData.waveSettings.monsterHealthMultiplierPerWave;
        monsterCountMultiplier = 1 + waveOffset * gameData.waveSettings.monsterCountMultiplierPerWave;
        eliteChance = waveOffset * gameData.waveSettings.eliteMonsterChancePerWave;
      }
      
      // 怪物数量
      let monsterCount = Math.min(5 + gameData.currentWave * 2, 50);
      if (gameData.waveSettings.endlessMode) {
        monsterCount = Math.min(Math.floor(monsterCount * monsterCountMultiplier), gameData.waveSettings.maxMonsterCount);
      }
      
      // 按类型分组
      const monstersByType = {};
      availableMonsters.forEach(type => monstersByType[type] = []);
      
      const waveFactor = Math.min(1, gameData.currentWave / 50);
      const difficulty = gameData.difficultySettings[gameData.difficulty];
      
      // 生成怪物
      for (let i = 0; i < monsterCount; i++) {
        let monsterType;
        if (gameData.currentWave <= 10) {
          const rand = Math.random();
          monsterType = rand < 0.6 ? 'normal' : rand < 0.85 ? 'fast' : 'heavy';
        } else {
          const rand = Math.random();
          if (rand < 0.25) monsterType = 'normal';
          else if (rand < 0.45) monsterType = 'fast';
          else if (rand < 0.6) monsterType = 'heavy';
          else if (rand < 0.7) monsterType = 'shield';
          else if (rand < 0.78) monsterType = 'healer';
          else if (rand < 0.85) monsterType = 'drone';
          else if (rand < 0.9) monsterType = 'bomber';
          else if (rand < 0.94) monsterType = 'mech';
          else if (rand < 0.97) monsterType = 'thief';
          else {
            const rareTypes = ['charger', 'assassin', 'reaper', 'ice-mage'];
            monsterType = rareTypes[Math.floor(Math.random() * rareTypes.length)];
          }
        }
        
        const monsterData = gameData.monsterTypes.find(m => m.id === monsterType);
        let currentWaveMultiplier = 1 + gameData.currentWave * 0.1;
        if (gameData.waveSettings.endlessMode) currentWaveMultiplier = waveMultiplier;
        
        let health = monsterData.health * difficulty.monsterHealthMultiplier * currentWaveMultiplier;
        let speed = monsterData.speed * difficulty.monsterSpeedMultiplier;
        let coreDamage = monsterData.coreDamage * difficulty.monsterCoreDamageMultiplier;
        
        if (gameData.waveSettings.endlessMode) {
          const waveOffset = Math.max(0, gameData.currentWave - gameData.waveSettings.maxBaseWave);
          speed *= 1 + waveOffset * gameData.waveSettings.monsterSpeedMultiplierPerWave;
        }
        
        // 精英怪物
        let isElite = false;
        if (gameData.waveSettings.endlessMode && Math.random() < eliteChance) {
          isElite = true;
          health *= gameData.waveSettings.eliteMonsterHealthMultiplier;
          speed *= gameData.waveSettings.eliteMonsterSpeedMultiplier;
          coreDamage *= 2;
        }
        
        // 标记是否有窃取者
        if (monsterType === 'thief') gameData.hasThief = true;
        
        const monster = {
          id: `monster-${Date.now()}-${i}`,
          type: monsterType,
          name: isElite ? `精英${monsterData.name}` : monsterData.name,
          health: health,
          maxHealth: health,
          speed: speed,
          coreDamage: coreDamage,
          position: { x: gameData.path[0].x, y: gameData.path[0].y },
          pathIndex: 0,
          progress: 0,
          isFlying: monsterType === 'drone',
          isStunned: false,
          isSlowed: false,
          slowDuration: 0,
          isElite: isElite,
          reward: isElite ? Math.floor(monsterData.reward * gameData.waveSettings.eliteMonsterRewardMultiplier) : monsterData.reward,
          isInvulnerable: false,
          invulnerableDuration: 0,
          invulnerableCooldown: 0,
          isBomberActivated: false,
          bomberTimer: 3 + Math.random() * 4,
          healerTimer: 0,
          reaperTimer: 0,
          iceMageTimer: 0,
          isCharging: false,
          originalSpeed: undefined
        };
        
        monstersByType[monsterType].push(monster);
      }
      
      // 交错生成
      const monsterQueues = [];
      availableMonsters.forEach(type => {
        if (monstersByType[type].length > 0) {
          monsterQueues.push({
            type: type,
            queue: [...monstersByType[type]],
            interval: 300 + Math.random() * 200
          });
        }
      });
      
      let globalTimer = 0;
      const interval = 100;
      
      function spawnNextMonster() {
        monsterQueues.forEach(queue => {
          if (queue.queue.length > 0 && globalTimer % Math.round(queue.interval / interval) === 0) {
            gameData.monsters.push(queue.queue.shift());
          }
        });
        
        globalTimer++;
        const remaining = monsterQueues.reduce((total, queue) => total + queue.queue.length, 0);
        if (remaining > 0) setTimeout(spawnNextMonster, interval);
      }
      
      if (monsterQueues.length > 0) spawnNextMonster();
    }

    function generateBoss() {
      const bossData = gameData.monsterTypes.find(m => m.id === gameData.waveSettings.bossMonster);
      const difficulty = gameData.difficultySettings[gameData.difficulty];
      const waveMultiplier = 1 + gameData.currentWave * 0.1;
      
      const boss = {
        id: `boss-${Date.now()}`,
        type: gameData.waveSettings.bossMonster,
        name: bossData.name,
        health: bossData.health * difficulty.monsterHealthMultiplier * waveMultiplier,
        maxHealth: bossData.health * difficulty.monsterHealthMultiplier * waveMultiplier,
        speed: bossData.speed * difficulty.monsterSpeedMultiplier,
        coreDamage: bossData.coreDamage * difficulty.monsterCoreDamageMultiplier,
        position: { x: gameData.path[0].x, y: gameData.path[0].y },
        pathIndex: 0,
        progress: 0,
        isFlying: false,
        isStunned: false,
        isSlowed: false,
        slowDuration: 0,
        isInvulnerable: false,
        invulnerableDuration: 0,
        summonTimer: 0,
        rocketTimer: 0
      };
      
      gameData.monsters.push(boss);
      gameData.currentBoss = boss;
      
      dom.bossHealthBar.classList.remove('hidden');
      dom.bossHealthText.classList.remove('hidden');
      updateBossHealthBar();
    }

    function updateBossHealthBar() {
      if (!gameData.currentBoss) return;
      const percent = (gameData.currentBoss.health / gameData.currentBoss.maxHealth) * 100;
      dom.bossHealthFill.style.width = `${percent}%`;
      dom.bossHealthText.textContent = `BOSS: ${Math.floor(gameData.currentBoss.health)}/${Math.floor(gameData.currentBoss.maxHealth)}`;
    }

    function handleCanvasClick(e) {
      if (gameData.gameState !== 'game' || gameData.isGameOver || gameData.isVictory) return;
      
      const rect = dom.gameCanvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      const gridX = Math.floor((x - gameData.gridOffset.x) / gameData.cellSize);
      const gridY = Math.floor((y - gameData.gridOffset.y) / gameData.cellSize);
      
      if (gridX >= 0 && gridX < gameData.gridSize.width && gridY >= 0 && gridY < gameData.gridSize.height) {
        // 加农炮目标选择
        if (gameData.isHowitzerTargeting && gameData.selectedHowitzer) {
          handleHowitzerTargetSelection(gridX, gridY);
          return;
        }
        
        // 点击已有炮塔
        const clickedTower = gameData.towers.find(t => t.position.x === gridX && t.position.y === gridY);
        if (clickedTower) {
          showTowerInfo(clickedTower);
          return;
        }
        
        // 放置炮塔
        if (gameData.selectedTower) {
          placeTower(gridX, gridY);
        }
      }
    }

    function handleHowitzerTargetSelection(gridX, gridY) {
      if (gameData.selectedTargetCell && gameData.selectedTargetCell.x === gridX && gameData.selectedTargetCell.y === gridY) {
        fireHowitzer(gameData.selectedHowitzer, gridX, gridY);
        gameData.isHowitzerTargeting = false;
        gameData.selectedHowitzer = null;
        gameData.selectedTargetCell = null;
      } else {
        gameData.selectedTargetCell = { x: gridX, y: gridY };
        showFloatingText(gridX, gridY, '点击确认发射', '#F59E0B', 2);
      }
    }

    function fireHowitzer(tower, targetX, targetY) {
      tower.cooldown = tower.fireRate;
      const projectile = {
        type: 'howitzer',
        towerType: 'howitzer',
        damage: tower.damage,
        position: { ...tower.position },
        target: { x: targetX, y: targetY },
        speed: 3,
        tower: tower
      };
      gameData.projectiles.push(projectile);
      showFloatingText(tower.position.x, tower.position.y, '发射！', '#F59E0B');
    }

    function handleCanvasMouseMove(e) {
      if (gameData.gameState !== 'game' || gameData.isGameOver || gameData.isVictory) return;
      
      const rect = dom.gameCanvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      const gridX = Math.floor((x - gameData.gridOffset.x) / gameData.cellSize);
      const gridY = Math.floor((y - gameData.gridOffset.y) / gameData.cellSize);
      
      gameData.selectedCell = (gridX >= 0 && gridX < gameData.gridSize.width && gridY >= 0 && gridY < gameData.gridSize.height)
        ? { x: gridX, y: gridY }
        : null;
    }

    function placeTower(x, y) {
      if (!isPathValid(x, y)) {
        showFloatingText(x, y, '阻挡路径！', '#EF4444');
        return;
      }
      
      const towerData = gameData.towerTypes.find(t => t.id === gameData.selectedTower);
      if (!towerData) return;
      
      if (gameData.money < towerData.price) {
        showFloatingText(x, y, '金钱不足！', '#EF4444');
        return;
      }
      
      const tower = {
        id: `tower-${Date.now()}`,
        type: towerData.id,
        name: towerData.name,
        range: towerData.range,
        damage: towerData.damage,
        fireRate: towerData.fireRate,
        price: towerData.price,
        totalCost: towerData.price,
        special: towerData.special,
        position: { x, y },
        level: 1,
        fireTimer: 0,
        isFrozen: false,
        frozenTimer: 0,
        isProtectedByFlame: false,
        cooldown: towerData.type === 'howitzer' ? 0 : undefined
      };
      
      gameData.money -= towerData.price;
      updateGameInfo();
      gameData.towers.push(tower);
      gameData.blockedCells.add(`${x},${y}`);
      soundManager.playSound('towerPlaceSound');
    }

    function showTowerInfo(tower) {
      dom.towerInfoName.textContent = tower.name;
      dom.towerInfoLevel.textContent = tower.level;
      dom.towerInfoRange.textContent = tower.range;
      dom.towerInfoDamage.textContent = tower.damage;
      dom.towerInfoFireRate.textContent = tower.fireRate;
      dom.towerInfoSpecial.textContent = tower.special;
      
      const upgradeCostValue = Math.floor(tower.price * tower.level / 4);
      dom.upgradeCost.textContent = upgradeCostValue;
      
      const sellAmountValue = Math.floor(tower.totalCost * 0.6);
      dom.sellAmount.textContent = sellAmountValue;
      
      gameData.selectedTower = tower;
      dom.towerInfoScreen.classList.remove('hidden');
      
      // 加农炮发射按钮
      const buttons = document.querySelector('.tower-info-buttons');
      let fireButton = document.getElementById('fire-howitzer');
      
      if (tower.type === 'howitzer') {
        if (!fireButton) {
          fireButton = document.createElement('div');
          fireButton.id = 'fire-howitzer';
          fireButton.className = 'tower-info-button fire-button';
          buttons.appendChild(fireButton);
        }
        
        if (tower.cooldown <= 0) {
          fireButton.textContent = '发射';
          fireButton.style.cursor = 'pointer';
          fireButton.onclick = (e) => {
            e.stopPropagation();
            startHowitzerTargeting(tower);
          };
        } else {
          fireButton.textContent = `冷却中: ${Math.ceil(tower.cooldown)}秒`;
          fireButton.style.cursor = 'not-allowed';
          fireButton.onclick = null;
        }
      } else if (fireButton) {
        fireButton.remove();
      }
    }

    function closeTowerInfo() {
      dom.towerInfoScreen.classList.add('hidden');
      gameData.selectedTower = null;
      
      const fireButton = document.getElementById('fire-howitzer');
      if (fireButton) fireButton.remove();
    }

    function startHowitzerTargeting(tower) {
      if (tower.cooldown > 0) return;
      closeTowerInfo();
      gameData.isHowitzerTargeting = true;
      gameData.selectedHowitzer = tower;
      gameData.selectedTargetCell = null;
      showFloatingText(tower.position.x, tower.position.y - 2, '请选择目标格子', '#F59E0B', 3);
    }

    function upgradeTower() {
      if (!gameData.selectedTower) return;
      const tower = gameData.selectedTower;
      const upgradeCostValue = Math.floor(tower.price * tower.level / 4);
      
      if (gameData.money < upgradeCostValue) {
        alert('金钱不足！');
        return;
      }
      
      gameData.money -= upgradeCostValue;
      tower.totalCost += upgradeCostValue;
      updateGameInfo();
      tower.level++;
      
      // 升级属性
      if (tower.type === 'laser') {
        tower.damage = Math.round(tower.damage + 1 * tower.level);
        tower.fireRate = Math.max(0.005, tower.fireRate * 0.85);
      } else {
        tower.damage = Math.floor(tower.damage * 1.5);
        tower.range = Math.floor(tower.range * 1.1);
        tower.fireRate = Math.max(0.1, tower.fireRate * 0.9);
      }
      
      showTowerInfo(tower);
    }

    function sellTower() {
      if (!gameData.selectedTower) return;
      const tower = gameData.selectedTower;
      const sellAmountValue = Math.floor(tower.totalCost * 0.6);
      
      gameData.money += sellAmountValue;
      updateGameInfo();
      gameData.blockedCells.delete(`${tower.position.x},${tower.position.y}`);
      
      const index = gameData.towers.indexOf(tower);
      if (index !== -1) gameData.towers.splice(index, 1);
      
      closeTowerInfo();
      soundManager.playSound('buttonClickSound');
    }

    function updateGameInfo() {
      dom.difficultyDisplay.textContent = `难度: ${getDifficultyName(gameData.difficulty)}`;
      dom.waveDisplay.textContent = `波数: ${gameData.currentWave}/${gameData.waveSettings.maxBaseWave}`;
      dom.moneyDisplay.textContent = `金钱: ${gameData.money}`;
      dom.coreHealthDisplay.textContent = `核心血量: ${gameData.coreHealth}`;
    }

    function getDifficultyName(difficulty) {
      const map = { easy: '简单', normal: '普通', hard: '困难', hell: '地狱' };
      return map[difficulty] || '未知';
    }

    function showFloatingText(gridX, gridY, text, color, duration = 1) {
      const x = gameData.gridOffset.x + gridX * gameData.cellSize + gameData.cellSize / 2;
      const y = gameData.gridOffset.y + gridY * gameData.cellSize + gameData.cellSize / 2;
      
      gameData.floatingTexts.push({
        x, y, text, color, time: 0, duration: duration
      });
    }

    function createExplosion(gridX, gridY, radius) {
      const x = gameData.gridOffset.x + gridX * gameData.cellSize + gameData.cellSize / 2;
      const y = gameData.gridOffset.y + gridY * gameData.cellSize + gameData.cellSize / 2;
      
      gameData.explosions.push({
        x, y, radius: radius * gameData.cellSize, time: 0
      });
    }

    function createLaser(startX, startY, endX, endY) {
      const dx = endX - startX;
      const dy = endY - startY;
      const length = Math.sqrt(dx * dx + dy * dy);
      const angle = Math.atan2(dy, dx);
      
      gameData.effects.push({
        type: 'laser', x: startX, y: startY, length, angle, time: 0
      });
    }

    function createFreezeEffect(gridX, gridY) {
      const x = gameData.gridOffset.x + gridX * gameData.cellSize + gameData.cellSize / 2;
      const y = gameData.gridOffset.y + gridY * gameData.cellSize + gameData.cellSize / 2;
      
      gameData.effects.push({
        type: 'freeze', x, y, size: gameData.cellSize, time: 0
      });
    }

    function createStunEffect(gridX, gridY) {
      const x = gameData.gridOffset.x + gridX * gameData.cellSize + gameData.cellSize / 2;
      const y = gameData.gridOffset.y + gridY * gameData.cellSize + gameData.cellSize / 2;
      
      gameData.effects.push({
        type: 'stun', x, y, size: gameData.cellSize, time: 0
      });
    }

    // 游戏主循环
    function gameLoop(timestamp) {
      if (!gameData.lastTime) gameData.lastTime = timestamp;
      // 限制deltaTime最大0.1秒，防止跳帧
      gameData.deltaTime = Math.min((timestamp - gameData.lastTime) / 1000, 0.1);
      gameData.lastTime = timestamp;
      
      dom.ctx.clearRect(0, 0, dom.gameCanvas.width, dom.gameCanvas.height);
      
      if (gameData.gameState === 'game') {
        updateGame();
        renderGame();
      }
      
      requestAnimationFrame(gameLoop);
    }

    function updateGame() {
      if (gameData.isGameOver || gameData.isVictory) return;
      
      // UI更新
      gameData.uiUpdateTimer += gameData.deltaTime;
      if (gameData.uiUpdateTimer >= 0.1) {
        if (gameData.selectedTower && !dom.towerInfoScreen.classList.contains('hidden')) {
          showTowerInfo(gameData.selectedTower);
        }
        gameData.uiUpdateTimer = 0;
      }
      
      // 波次结束检查
      if (gameData.isWaveActive && gameData.monsters.length === 0) {
        gameData.isWaveActive = false;
        gameData.waveStartTime = Date.now();
        
        if (gameData.currentWave === gameData.waveSettings.bossWave) {
          gameData.isVictory = true;
          changeGameState('victory');
          return;
        }
        
        gameData.currentWave++;
      }
      
      // 下一波开始
      if (!gameData.isWaveActive && Date.now() - gameData.waveStartTime >= gameData.waveDelay) {
        startWave();
      }
      
      // 更新游戏对象
      updateTowers();
      updateMonsters();
      updateProjectiles();
      updateExplosions();
      updateEffects();
      updateFloatingTexts();
      
      // 游戏结束检查
      if (gameData.coreHealth <= 0) {
        gameData.isGameOver = true;
        changeGameState('game-over');
      }
    }

    // 烈火炮保护逻辑 修复先加后清的bug
    function handleFlameTowerProtection() {
      // 先清除所有保护标记
      gameData.towers.forEach(tower => {
        tower.isProtectedByFlame = false;
      });
      
      // 再设置活跃烈火炮的保护
      const activeFlameTowers = gameData.towers.filter(tower => tower.type === 'flame' && !tower.isFrozen);
      activeFlameTowers.forEach(flameTower => {
        const { x, y } = flameTower.position;
        for (let dx = -1; dx <= 1; dx++) {
          for (let dy = -1; dy <= 1; dy++) {
            const targetX = x + dx;
            const targetY = y + dy;
            const protectedTower = gameData.towers.find(t => t.position.x === targetX && t.position.y === targetY);
            if (protectedTower) protectedTower.isProtectedByFlame = true;
          }
        }
      });
    }

    function updateTowers() {
      handleFlameTowerProtection();
      
      gameData.towers.forEach(tower => {
        // 烈火炮解冻
        if (tower.type === 'flame' && tower.isFrozen && tower.frozenTimer > 0) {
          tower.frozenTimer -= gameData.deltaTime;
          if (tower.frozenTimer <= 0) {
            tower.isFrozen = false;
            tower.frozenTimer = 0;
          }
        }
        
        if (tower.isFrozen) return;
        
        // 加农炮冷却
        if (tower.type === 'howitzer' && tower.cooldown !== undefined) {
          tower.cooldown = Math.max(0, tower.cooldown - gameData.deltaTime);
        }
        
        // 射击计时器
        tower.fireTimer += gameData.deltaTime;
        if (tower.fireTimer >= tower.fireRate) {
          const target = findTarget(tower);
          if (target) {
            shootTarget(tower, target);
            tower.fireTimer = 0;
          }
        }
      });
    }

    function findTarget(tower) {
      for (const monster of gameData.monsters) {
        const dx = monster.position.x - tower.position.x;
        const dy = monster.position.y - tower.position.y;
        const distance = Math.sqrt(dx * dx + dy * dy);
        
        if (distance <= tower.range) {
          // 防空炮只打无人机
          if (tower.type === 'anti-air' && monster.type !== 'drone') continue;
          return monster;
        }
      }
      return null;
    }

    function shootTarget(tower, target) {
      switch (tower.type) {
        case 'energy':
        case 'rapid':
        case 'ice':
        case 'titan':
        case 'sniper':
        case 'anti-air':
        case 'flame':
          createProjectile(tower, target);
          break;
        case 'pierce':
          createPierceProjectile(tower, target);
          break;
        case 'laser':
          createLaserEffect(tower);
          break;
        case 'rocket':
          createRocketProjectile(tower, target);
          break;
        case 'electro':
          createElectroProjectile(tower, target);
          break;
      }
    }

    function createProjectile(tower, target) {
      gameData.projectiles.push({
        type: 'normal',
        towerType: tower.type,
        damage: tower.damage,
        position: { ...tower.position },
        target: { ...target.position },
        speed: 10,
        tower: tower
      });
    }

    function createPierceProjectile(tower, target) {
      const dx = target.position.x - tower.position.x;
      const dy = target.position.y - tower.position.y;
      const distance = Math.sqrt(dx * dx + dy * dy);
      
      gameData.projectiles.push({
        type: 'pierce',
        towerType: tower.type,
        damage: tower.damage,
        position: { ...tower.position },
        direction: { x: dx / distance, y: dy / distance },
        speed: 8,
        distance: 0,
        maxDistance: tower.range,
        tower: tower
      });
    }

    function createLaserEffect(tower) {
      const target = findTarget(tower);
      if (!target) return;
      
      const startX = gameData.gridOffset.x + tower.position.x * gameData.cellSize + gameData.cellSize / 2;
      const startY = gameData.gridOffset.y + tower.position.y * gameData.cellSize + gameData.cellSize / 2;
      const endX = gameData.gridOffset.x + target.position.x * gameData.cellSize + gameData.cellSize / 2;
      const endY = gameData.gridOffset.y + target.position.y * gameData.cellSize + gameData.cellSize / 2;
      
      createLaser(startX, startY, endX, endY);
      damageMonster(target, tower.damage);
      
      // 穿透伤害
      const dx = target.position.x - tower.position.x;
      const dy = target.position.y - tower.position.y;
      const distance = Math.sqrt(dx * dx + dy * dy);
      const direction = { x: dx / distance, y: dy / distance };
      
      gameData.monsters.forEach(monster => {
        if (monster === target) return;
        const mx = monster.position.x - tower.position.x;
        const my = monster.position.y - tower.position.y;
        const dot = mx * direction.x + my * direction.y;
        
        if (dot < 0 || dot > tower.range) return;
        
        const cross = mx * direction.y - my * direction.x;
        if (Math.abs(cross) < 0.5) {
          damageMonster(monster, tower.damage * gameData.deltaTime * 2);
        }
      });
    }

    function createRocketProjectile(tower, target) {
      gameData.projectiles.push({
        type: 'rocket',
        towerType: tower.type,
        damage: tower.damage,
        position: { ...tower.position },
        target: { ...target.position },
        speed: 5,
        tower: tower
      });
    }

    function createElectroProjectile(tower, target) {
      gameData.projectiles.push({
        type: 'electro',
        towerType: tower.type,
        damage: tower.damage,
        position: { ...tower.position },
        target: { ...target.position },
        speed: 7,
        tower: tower
      });
    }

    function updateProjectiles() {
      for (let i = gameData.projectiles.length - 1; i >= 0; i--) {
        const projectile = gameData.projectiles[i];
        
        switch (projectile.type) {
          case 'normal':
          case 'rocket':
          case 'electro':
          case 'howitzer':
            const dx = projectile.target.x - projectile.position.x;
            const dy = projectile.target.y - projectile.position.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            if (distance < 0.1) {
              handleProjectileHit(projectile);
              gameData.projectiles.splice(i, 1);
            } else {
              const speed = projectile.speed * gameData.deltaTime;
              projectile.position.x += (dx / distance) * speed;
              projectile.position.y += (dy / distance) * speed;
              
              // 追踪弹更新目标
              if (['rocket', 'electro'].includes(projectile.type)) {
                const target = findTarget(projectile.tower);
                if (target) projectile.target = { ...target.position };
              }
            }
            break;
            
          case 'pierce':
            projectile.position.x += projectile.direction.x * projectile.speed * gameData.deltaTime;
            projectile.position.y += projectile.direction.y * projectile.speed * gameData.deltaTime;
            projectile.distance += projectile.speed * gameData.deltaTime;
            
            if (projectile.distance >= projectile.maxDistance) {
              gameData.projectiles.splice(i, 1);
              continue;
            }
            
            // 穿透伤害
            for (const monster of gameData.monsters) {
              const dx = monster.position.x - projectile.position.x;
              const dy = monster.position.y - projectile.position.y;
              const distance = Math.sqrt(dx * dx + dy * dy);
              
              if (distance < 0.5) {
                damageMonster(monster, projectile.damage);
              }
            }
            break;
        }
      }
    }

    function handleProjectileHit(projectile) {
      // BOSS火箭弹
      if (projectile.isBossRocket) {
        for (let j = gameData.towers.length - 1; j >= 0; j--) {
          const tower = gameData.towers[j];
          const dx = tower.position.x - projectile.position.x;
          const dy = tower.position.y - projectile.position.y;
          if (Math.sqrt(dx * dx + dy * dy) <= 0.5) {
            gameData.blockedCells.delete(`${tower.position.x},${tower.position.y}`);
            gameData.towers.splice(j, 1);
          }
        }
        createExplosion(projectile.position.x, projectile.position.y, 1.5);
        gameData.monsters.forEach(monster => {
          const dx = monster.position.x - projectile.position.x;
          const dy = monster.position.y - projectile.position.y;
          if (Math.sqrt(dx * dx + dy * dy) <= 1.5) {
            damageMonster(monster, projectile.damage);
          }
        });
        return;
      }
      
      switch (projectile.type) {
        case 'normal':
          const targetMonster = findClosestMonster(projectile.position.x, projectile.position.y, 0.5);
          if (targetMonster) {
            damageMonster(targetMonster, projectile.damage);
            
            // 冰锥炮减速
            if (projectile.towerType === 'ice' && !targetMonster.isSlowed && targetMonster.type !== 'mech') {
              targetMonster.isSlowed = true;
              targetMonster.originalSpeed = targetMonster.speed;
              targetMonster.speed *= 0.5;
              targetMonster.slowDuration = 5;
              createFreezeEffect(targetMonster.position.x, targetMonster.position.y);
            }
            
            // 狙击炮暴击
            if (projectile.towerType === 'sniper' && Math.random() < 0.25) {
              damageMonster(targetMonster, projectile.damage);
              showFloatingText(targetMonster.position.x, targetMonster.position.y, '暴击!', '#F59E0B');
            }
          }
          break;
          
        case 'rocket':
          createExplosion(projectile.position.x, projectile.position.y, 0.3);
          gameData.monsters.forEach(monster => {
            const dx = monster.position.x - projectile.position.x;
            const dy = monster.position.y - projectile.position.y;
            if (Math.sqrt(dx * dx + dy * dy) <= 0.3) {
              damageMonster(monster, projectile.damage);
            }
          });
          break;
          
        case 'electro':
          createExplosion(projectile.position.x, projectile.position.y, 0.2);
          gameData.monsters.forEach(monster => {
            const dx = monster.position.x - projectile.position.x;
            const dy = monster.position.y - projectile.position.y;
            if (Math.sqrt(dx * dx + dy * dy) <= 0.2) {
              damageMonster(monster, projectile.damage);
              if (!monster.isStunned && monster.type !== 'mech') {
                monster.isStunned = true;
                monster.stunDuration = 1;
                createStunEffect(monster.position.x, monster.position.y);
              }
            }
          });
          break;
          
        case 'howitzer':
          createExplosion(projectile.position.x, projectile.position.y, 3);
          gameData.monsters.forEach(monster => {
            const dx = Math.abs(monster.position.x - projectile.position.x);
            const dy = Math.abs(monster.position.y - projectile.position.y);
            if (dx <= 3 && dy <= 3) {
              damageMonster(monster, projectile.damage);
              showFloatingText(monster.position.x, monster.position.y, `-${projectile.damage}`, '#EF4444');
            }
          });
          showFloatingText(projectile.position.x, projectile.position.y, '超大范围伤害!', '#F59E0B', 2);
          break;
      }
    }

    function findClosestMonster(x, y, radius) {
      let closest = null;
      let minDist = Infinity;
      
      gameData.monsters.forEach(monster => {
        const dx = monster.position.x - x;
        const dy = monster.position.y - y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        
        if (dist < minDist && dist <= radius) {
          minDist = dist;
          closest = monster;
        }
      });
      
      return closest;
    }

    function updateMonsters() {
      // 预缓存盾牌士兵
      gameData.shieldMonsters = gameData.monsters.filter(m => m.type === 'shield' && m.health > 0);
      
      // 窃取者偷钱
      if (gameData.hasThief) {
        const thiefCount = gameData.monsters.filter(m => m.type === 'thief' && m.health > 0).length;
        if (thiefCount > 0) {
          gameData.money = Math.max(0, gameData.money - thiefCount * 10 * gameData.deltaTime);
          updateGameInfo();
        }
      }
      
      for (let i = gameData.monsters.length - 1; i >= 0; i--) {
        const monster = gameData.monsters[i];
        
        // 怪物死亡
        if (monster.health <= 0) {
          if (monster.type === 'bomber' && !monster.isBomberActivated) {
            // 被击杀不爆炸
          }
          
          gameData.monsters.splice(i, 1);
          
          // 击杀奖励
          let money = gameData.difficultySettings[gameData.difficulty].moneyPerKill;
          // 窃取者在场时收益降低
          if (gameData.hasThief) money = Math.floor(money * 0.1);
          
          gameData.money += money;
          updateGameInfo();
          showFloatingText(monster.position.x, monster.position.y, `+${money}`, '#10B981');
          soundManager.playSound('enemyDieSound');
          
          // BOSS死亡
          if (monster.type === gameData.waveSettings.bossMonster) {
            dom.bossHealthBar.classList.add('hidden');
            dom.bossHealthText.classList.add('hidden');
            gameData.currentBoss = null;
          }
          
          continue;
        }
        
        // 状态效果
        if (monster.isStunned) {
          monster.stunDuration -= gameData.deltaTime;
          if (monster.stunDuration <= 0) monster.isStunned = false;
          else continue;
        }
        
        if (monster.isSlowed) {
          monster.slowDuration -= gameData.deltaTime;
          if (monster.slowDuration <= 0) {
            monster.isSlowed = false;
            monster.speed = monster.originalSpeed;
          }
        }
        
        if (monster.isInvulnerable) {
          monster.invulnerableDuration -= gameData.deltaTime;
          if (monster.invulnerableDuration <= 0) {
            monster.isInvulnerable = false;
            if (monster.originalSpeed !== undefined) {
              monster.speed = monster.originalSpeed;
              monster.originalSpeed = undefined;
            }
          }
        }
        
        if (monster.type === 'assassin' && monster.invulnerableCooldown > 0) {
          monster.invulnerableCooldown -= gameData.deltaTime;
        }
        
        // 特殊怪物逻辑
        switch (monster.type) {
          case 'bomber':
            monster.bomberTimer -= gameData.deltaTime;
            if (monster.bomberTimer <= 0 && !monster.isBomberActivated) {
              monster.isBomberActivated = true;
              createExplosion(monster.position.x, monster.position.y, 1.5);
              
              // 炸毁炮塔
              for (let j = gameData.towers.length - 1; j >= 0; j--) {
                const tower = gameData.towers[j];
                const dx = tower.position.x - monster.position.x;
                const dy = tower.position.y - monster.position.y;
                if (Math.sqrt(dx * dx + dy * dy) <= 1.5) {
                  gameData.blockedCells.delete(`${tower.position.x},${tower.position.y}`);
                  gameData.towers.splice(j, 1);
                }
              }
              
              gameData.monsters.splice(i, 1);
              continue;
            }
            break;
            
          case 'healer':
            monster.healerTimer -= gameData.deltaTime;
            if (monster.healerTimer <= 0) {
              gameData.monsters.forEach(m => {
                if (m.health < m.maxHealth) {
                  m.health = Math.min(m.maxHealth, m.health + 15);
                }
              });
              monster.healerTimer = 1;
            }
            break;
            
          case 'reaper':
            monster.reaperTimer -= gameData.deltaTime;
            if (monster.reaperTimer <= 0) {
              const dirs = [[0,-1], [0,1], [-1,0], [1,0]];
              const dir = dirs[Math.floor(Math.random() * dirs.length)];
              
              const startX = gameData.gridOffset.x + monster.position.x * gameData.cellSize + gameData.cellSize / 2;
              const startY = gameData.gridOffset.y + monster.position.y * gameData.cellSize + gameData.cellSize / 2;
              const endX = startX + dir[0] * 3 * gameData.cellSize;
              const endY = startY + dir[1] * 3 * gameData.cellSize;
              
              createLaser(startX, startY, endX, endY);
              
              // 摧毁炮塔
              for (let j = 1; j <= 3; j++) {
                const x = monster.position.x + dir[0] * j;
                const y = monster.position.y + dir[1] * j;
                if (x >= 0 && x < gameData.gridSize.width && y >= 0 && y < gameData.gridSize.height) {
                  for (let k = gameData.towers.length - 1; k >= 0; k--) {
                    const tower = gameData.towers[k];
                    if (tower.position.x === x && tower.position.y === y) {
                      gameData.blockedCells.delete(`${x},${y}`);
                      gameData.towers.splice(k, 1);
                      break;
                    }
                  }
                }
              }
              
              monster.reaperTimer = 3;
            }
            break;
            
          case 'ice-mage':
            monster.iceMageTimer -= gameData.deltaTime;
            if (monster.iceMageTimer <= 0 && gameData.towers.length > 0) {
              const tower = gameData.towers[Math.floor(Math.random() * gameData.towers.length)];
              if (!tower.isFrozen && !tower.isProtectedByFlame) {
                if (tower.type === 'flame') {
                  tower.isFrozen = true;
                  tower.frozenTimer = 10;
                } else {
                  tower.isFrozen = true;
                }
                createFreezeEffect(tower.position.x, tower.position.y);
              }
              monster.iceMageTimer = 3;
            }
            break;
            
          case 'boss':
            // 召唤怪物
            monster.summonTimer -= gameData.deltaTime;
            if (monster.summonTimer <= 0 && gameData.monsters.length < 30) {
              const monsterType = gameData.waveSettings.allMonsters[Math.floor(Math.random() * gameData.waveSettings.allMonsters.length)];
              const monsterData = gameData.monsterTypes.find(m => m.id === monsterType);
              const difficulty = gameData.difficultySettings[gameData.difficulty];
              
              const newMonster = {
                id: `monster-${Date.now()}-${gameData.monsters.length}`,
                type: monsterType,
                name: monsterData.name,
                health: monsterData.health * difficulty.monsterHealthMultiplier * (1 + gameData.currentWave * 0.05),
                maxHealth: monsterData.health * difficulty.monsterHealthMultiplier * (1 + gameData.currentWave * 0.05),
                speed: monsterData.speed * difficulty.monsterSpeedMultiplier,
                coreDamage: monsterData.coreDamage * difficulty.monsterCoreDamageMultiplier,
                position: { x: monster.position.x, y: monster.position.y },
                pathIndex: monster.pathIndex,
                progress: monster.progress,
                isFlying: monsterType === 'drone',
                isStunned: false,
                isSlowed: false,
                slowDuration: 0,
                isInvulnerable: false,
                invulnerableDuration: 0,
                isBomberActivated: false,
                bomberTimer: 5,
                healerTimer: 0,
                reaperTimer: 0,
                iceMageTimer: 0
              };
              
              gameData.monsters.push(newMonster);
              monster.summonTimer = 8;
            }
            
            // 发射火箭弹
            monster.rocketTimer -= gameData.deltaTime;
            if (monster.rocketTimer <= 0 && gameData.towers.length > 0) {
              const rocketCount = gameData.towers.length > 5 ? 2 : 1;
              const targetTowers = [];
              const availableTowers = [...gameData.towers];
              
              for (let j = 0; j < rocketCount && availableTowers.length > 0; j++) {
                const index = Math.floor(Math.random() * availableTowers.length);
                targetTowers.push(availableTowers[index]);
                availableTowers.splice(index, 1);
              }
              
              targetTowers.forEach(tower => {
                gameData.projectiles.push({
                  type: 'rocket',
                  towerType: 'rocket',
                  damage: 1000,
                  position: { ...monster.position },
                  target: { ...tower.position },
                  speed: 3,
                  isBossRocket: true
                });
              });
              
              monster.rocketTimer = 8;
            }
            
            // 更新BOSS血条
            gameData.lastBossHealthUpdate += gameData.deltaTime;
            if (gameData.lastBossHealthUpdate >= 0.2) {
              updateBossHealthBar();
              gameData.lastBossHealthUpdate = 0;
            }
            break;
        }
        
        // 怪物移动
        if (!monster.isStunned) {
          if (monster.isFlying) {
            // 飞行怪物直飞终点
            const end = gameData.path[gameData.path.length - 1];
            const dx = end.x - monster.position.x;
            const dy = end.y - monster.position.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            if (distance < 0.3) {
              damageCore(monster.coreDamage);
              gameData.monsters.splice(i, 1);
            } else {
              const speed = monster.speed * gameData.deltaTime * 0.15;
              monster.position.x += (dx / distance) * speed;
              monster.position.y += (dy / distance) * speed;
            }
          } else {
            // 地面怪物沿路径移动
            if (monster.pathIndex < gameData.path.length - 1) {
              const current = gameData.path[monster.pathIndex];
              const next = gameData.path[monster.pathIndex + 1];
              const dx = next.x - current.x;
              const dy = next.y - current.y;
              const distance = Math.sqrt(dx * dx + dy * dy);
              
              monster.progress += monster.speed * gameData.deltaTime * 0.15;
              
              if (monster.progress >= distance) {
                monster.pathIndex++;
                monster.progress = 0;
              } else {
                const ratio = monster.progress / distance;
                monster.position.x = current.x + dx * ratio;
                monster.position.y = current.y + dy * ratio;
              }
            } else {
              // 到达终点
              damageCore(monster.coreDamage);
              gameData.monsters.splice(i, 1);
            }
          }
        }
      }
    }

    function damageMonster(monster, damage) {
      if (monster.isInvulnerable) return;
      
      // 盾牌免伤
      let isProtected = false;
      if (monster.type !== 'shield' && gameData.shieldMonsters.length > 0) {
        for (const shield of gameData.shieldMonsters) {
          const dx = monster.position.x - shield.position.x;
          const dy = monster.position.y - shield.position.y;
          if (Math.sqrt(dx * dx + dy * dy) <= 1) {
            isProtected = true;
            break;
          }
        }
      }
      
      const finalDamage = isProtected ? damage * 0.1 : damage;
      monster.health = Math.max(0, monster.health - finalDamage);
      
      soundManager.playSound('enemyHitSound');
      
      // 特殊效果
      if (monster.type === 'charger' && !monster.isCharging) {
        monster.isCharging = true;
        monster.originalSpeed = monster.speed;
        monster.speed = 6;
      }
      
      if (monster.type === 'assassin' && !monster.isInvulnerable && monster.invulnerableCooldown <= 0) {
        monster.isInvulnerable = true;
        monster.invulnerableDuration = 5;
        monster.invulnerableCooldown = 15;
        monster.originalSpeed = monster.speed;
        monster.speed = 8;
      }
      
      // 受击效果
      const x = gameData.gridOffset.x + monster.position.x * gameData.cellSize + gameData.cellSize / 2;
      const y = gameData.gridOffset.y + monster.position.y * gameData.cellSize + gameData.cellSize / 2;
      gameData.effects.push({ type: 'hit', x, y, size: gameData.cellSize, time: 0 });
    }

    function damageCore(amount) {
      gameData.coreHealth = Math.max(0, gameData.coreHealth - amount);
      updateGameInfo();
      
      const end = gameData.path[gameData.path.length - 1];
      showFloatingText(end.x, end.y, `-${amount}`, '#EF4444');
      
      gameData.effects.push({
        type: 'hit',
        x: gameData.gridOffset.x + end.x * gameData.cellSize + gameData.cellSize / 2,
        y: gameData.gridOffset.y + end.y * gameData.cellSize + gameData.cellSize / 2,
        size: gameData.cellSize * 1.5,
        time: 0
      });
    }

    function updateExplosions() {
      for (let i = gameData.explosions.length - 1; i >= 0; i--) {
        const exp = gameData.explosions[i];
        exp.time += gameData.deltaTime;
        if (exp.time >= 0.5) gameData.explosions.splice(i, 1);
      }
    }

    function updateEffects() {
      for (let i = gameData.effects.length - 1; i >= 0; i--) {
        const effect = gameData.effects[i];
        effect.time += gameData.deltaTime;
        
        if ((effect.type === 'laser' && effect.time >= 0.3) ||
            (['freeze', 'stun', 'hit', 'smoke'].includes(effect.type) && effect.time >= 1)) {
          gameData.effects.splice(i, 1);
        }
      }
    }

    function updateFloatingTexts() {
      for (let i = gameData.floatingTexts.length - 1; i >= 0; i--) {
        const text = gameData.floatingTexts[i];
        text.time += gameData.deltaTime;
        text.y -= 30 * gameData.deltaTime;
        
        if (text.time >= text.duration) {
          gameData.floatingTexts.splice(i, 1);
        }
      }
    }

    // 渲染函数
    function renderGame() {
      renderGrid();
      renderPath();
      renderTowers();
      renderMonsters();
      renderProjectiles();
      renderExplosions();
      renderEffects();
      renderFloatingTexts();
      renderSelectedCell();
    }

    function renderGrid() {
      dom.ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
      dom.ctx.lineWidth = 1;
      
      // 垂直线
      for (let x = 0; x <= gameData.gridSize.width; x++) {
        dom.ctx.beginPath();
        dom.ctx.moveTo(gameData.gridOffset.x + x * gameData.cellSize, gameData.gridOffset.y);
        dom.ctx.lineTo(gameData.gridOffset.x + x * gameData.cellSize, gameData.gridOffset.y + gameData.gridSize.height * gameData.cellSize);
        dom.ctx.stroke();
      }
      
      // 水平线
      for (let y = 0; y <= gameData.gridSize.height; y++) {
        dom.ctx.beginPath();
        dom.ctx.moveTo(gameData.gridOffset.x, gameData.gridOffset.y + y * gameData.cellSize);
        dom.ctx.lineTo(gameData.gridOffset.x + gameData.gridSize.width * gameData.cellSize, gameData.gridOffset.y + y * gameData.cellSize);
        dom.ctx.stroke();
      }
      
      // 禁止放置区域
      dom.ctx.fillStyle = 'rgba(239, 68, 68, 0.2)';
      // 起点3x3
      for (let x = 0; x < 3; x++) {
        for (let y = 0; y < 3; y++) {
          dom.ctx.fillRect(
            gameData.gridOffset.x + x * gameData.cellSize,
            gameData.gridOffset.y + y * gameData.cellSize,
            gameData.cellSize,
            gameData.cellSize
          );
        }
      }
      // 终点3x3
      const end = gameData.path[gameData.path.length - 1];
      for (let x = end.x - 1; x <= end.x + 1; x++) {
        for (let y = end.y - 1; y <= end.y + 1; y++) {
          if (x >= 0 && x < gameData.gridSize.width && y >= 0 && y < gameData.gridSize.height) {
            dom.ctx.fillRect(
              gameData.gridOffset.x + x * gameData.cellSize,
              gameData.gridOffset.y + y * gameData.cellSize,
              gameData.cellSize,
              gameData.cellSize
            );
          }
        }
      }
    }

    function renderPath() {
      dom.ctx.fillStyle = 'rgba(107, 114, 128, 0.3)';
      gameData.path.forEach(point => {
        dom.ctx.fillRect(
          gameData.gridOffset.x + point.x * gameData.cellSize,
          gameData.gridOffset.y + point.y * gameData.cellSize,
          gameData.cellSize,
          gameData.cellSize
        );
      });
      
      // 起点
      const start = gameData.path[0];
      dom.ctx.fillStyle = 'rgba(16, 185, 129, 0.7)';
      dom.ctx.fillRect(
        gameData.gridOffset.x + start.x * gameData.cellSize,
        gameData.gridOffset.y + start.y * gameData.cellSize,
        gameData.cellSize,
        gameData.cellSize
      );
      dom.ctx.fillStyle = 'white';
      dom.ctx.font = '20px FontAwesome';
      dom.ctx.textAlign = 'center';
      dom.ctx.textBaseline = 'middle';
      dom.ctx.fillText('\uf0d0', 
        gameData.gridOffset.x + start.x * gameData.cellSize + gameData.cellSize / 2,
        gameData.gridOffset.y + start.y * gameData.cellSize + gameData.cellSize / 2
      );
      
      // 终点
      dom.ctx.fillStyle = 'rgba(239, 68, 68, 0.7)';
      dom.ctx.fillRect(
        gameData.gridOffset.x + end.x * gameData.cellSize,
        gameData.gridOffset.y + end.y * gameData.cellSize,
        gameData.cellSize,
        gameData.cellSize
      );
      dom.ctx.fillStyle = 'white';
      dom.ctx.font = '24px FontAwesome';
      dom.ctx.textAlign = 'center';
      dom.ctx.textBaseline = 'middle';
      dom.ctx.fillText('\uf0e7',
        gameData.gridOffset.x + end.x * gameData.cellSize + gameData.cellSize / 2,
        gameData.gridOffset.y + end.y * gameData.cellSize + gameData.cellSize / 2
      );
      
      dom.ctx.fillStyle = 'white';
      dom.ctx.font = '12px Arial';
      dom.ctx.textAlign = 'center';
      dom.ctx.textBaseline = 'top';
      dom.ctx.fillText(`${gameData.coreHealth}/100`,
        gameData.gridOffset.x + end.x * gameData.cellSize + gameData.cellSize / 2,
        gameData.gridOffset.y + end.y * gameData.cellSize - 15
      );
    }

    function renderTowers() {
      gameData.towers.forEach(tower => {
        const x = gameData.gridOffset.x + tower.position.x * gameData.cellSize;
        const y = gameData.gridOffset.y + tower.position.y * gameData.cellSize;
        
        // 底座
        dom.ctx.fillStyle = '#374151';
        dom.ctx.fillRect(x, y, gameData.cellSize, gameData.cellSize);
        
        // 炮塔主体
        let color = '#3B82F6';
        switch (tower.type) {
          case 'energy': color = '#3B82F6'; break;
          case 'rapid': color = '#10B981'; break;
          case 'ice': color = '#60A5FA'; break;
          case 'pierce': color = '#8B5CF6'; break;
          case 'laser': color = '#EC4899'; break;
          case 'rocket': color = '#EF4444'; break;
          case 'electro': color = '#F59E0B'; break;
          case 'titan': color = '#1F2937'; break;
          case 'sniper': color = '#4B5563'; break;
          case 'anti-air': color = '#3B82F6'; break;
          case 'flame': color = '#F59E0B'; break;
          case 'howitzer': color = '#DC2626'; break;
        }
        
        if (tower.isFrozen) color = 'rgba(96, 165, 250, 0.7)';
        
        dom.ctx.fillStyle = color;
        dom.ctx.beginPath();
        dom.ctx.arc(x + gameData.cellSize / 2, y + gameData.cellSize / 2, gameData.cellSize / 3, 0, Math.PI * 2);
        dom.ctx.fill();
        
        // 炮管
        dom.ctx.fillStyle = '#1F2937';
        dom.ctx.save();
        dom.ctx.translate(x + gameData.cellSize / 2, y + gameData.cellSize / 2);
        
        let angle = 0;
        const target = findTarget(tower);
        if (target) {
          const dx = target.position.x - tower.position.x;
          const dy = target.position.y - tower.position.y;
          angle = Math.atan2(dy, dx);
        }
        
        dom.ctx.rotate(angle);
        dom.ctx.fillRect(gameData.cellSize / 3, -2, gameData.cellSize / 3, 4);
        dom.ctx.restore();
        
        // 等级
        dom.ctx.fillStyle = 'white';
        dom.ctx.font = '12px Arial';
        dom.ctx.textAlign = 'center';
        dom.ctx.textBaseline = 'middle';
        dom.ctx.fillText(`Lv${tower.level}`, x + gameData.cellSize / 2, y + gameData.cellSize - 10);
        
        // 选中炮塔的射程
        if (gameData.selectedTower && gameData.selectedTower.id === tower.id) {
          dom.ctx.strokeStyle = 'rgba(59, 130, 246, 0.5)';
          dom.ctx.lineWidth = 2;
          dom.ctx.setLineDash([5, 5]);
          dom.ctx.beginPath();
          dom.ctx.arc(
            x + gameData.cellSize / 2,
            y + gameData.cellSize / 2,
            tower.range * gameData.cellSize,
            0,
            Math.PI * 2
          );
          dom.ctx.stroke();
          dom.ctx.setLineDash([]);
        }
      });
    }

    function getMonsterBorderColor(type, isElite) {
      if (isElite) return 'rgba(255, 215, 0, 0.9)';
      const map = {
        normal: 'rgba(255, 255, 255, 0.7)',
        fast: 'rgba(255, 255, 0, 0.7)',
        heavy: 'rgba(128, 128, 128, 0.7)',
        shield: 'rgba(0, 255, 0, 0.7)',
        healer: 'rgba(255, 0, 255, 0.7)',
        drone: 'rgba(255, 165, 0, 0.7)',
        bomber: 'rgba(255, 0, 0, 0.7)',
        mech: 'rgba(0, 0, 255, 0.7)',
        thief: 'rgba(0, 255, 255, 0.7)',
        charger: 'rgba(255, 105, 180, 0.7)',
        assassin: 'rgba(128, 0, 128, 0.7)',
        reaper: 'rgba(0, 0, 0, 0.7)',
        'ice-mage': 'rgba(135, 206, 235, 0.7)',
        boss: 'rgba(128, 0, 0, 0.9)'
      };
      return map[type] || 'rgba(255, 255, 255, 0.7)';
    }

    function renderMonsters() {
      gameData.monsters.forEach(monster => {
        const x = gameData.gridOffset.x + monster.position.x * gameData.cellSize;
        const y = gameData.gridOffset.y + monster.position.y * gameData.cellSize;
        
        let baseColor = '#9CA3AF';
        switch (monster.type) {
          case 'normal': baseColor = '#9CA3AF'; break;
          case 'fast': baseColor = '#10B981'; break;
          case 'heavy': baseColor = '#4B5563'; break;
          case 'shield': baseColor = '#3B82F6'; break;
          case 'healer': baseColor = '#8B5CF6'; break;
          case 'drone': baseColor = '#EC4899'; break;
          case 'bomber': baseColor = '#EF4444'; break;
          case 'mech': baseColor = '#1F2937'; break;
          case 'thief': baseColor = '#F59E0B'; break;
          case 'charger': baseColor = '#60A5FA'; break;
          case 'assassin': baseColor = '#8B5CF6'; break;
          case 'reaper': baseColor = '#1F2937'; break;
          case 'ice-mage': baseColor = '#60A5FA'; break;
          case 'boss': baseColor = '#7F1D1D'; break;
        }
        
        // 状态效果
        let fillColor = baseColor;
        if (monster.isSlowed) fillColor = 'rgba(96, 165, 250, 0.9)';
        if (monster.isStunned) fillColor = 'rgba(245, 158, 11, 0.9)';
        if (monster.isInvulnerable) {
          fillColor = Math.floor(monster.invulnerableDuration * 10) % 2 === 0 
            ? 'rgba(255, 255, 255, 0.9)' 
            : baseColor;
        }
        
        dom.ctx.fillStyle = fillColor;
        
        // 绘制怪物
        const radius = monster.isElite ? gameData.cellSize * 0.6 : gameData.cellSize * 0.5;
        dom.ctx.beginPath();
        dom.ctx.arc(x + gameData.cellSize / 2, y + gameData.cellSize / 2, radius, 0, Math.PI * 2);
        dom.ctx.fill();
        
        // 边框
        dom.ctx.strokeStyle = getMonsterBorderColor(monster.type, monster.isElite);
        dom.ctx.lineWidth = monster.isElite ? 3 : 2;
        dom.ctx.beginPath();
        dom.ctx.arc(x + gameData.cellSize / 2, y + gameData.cellSize / 2, radius, 0, Math.PI * 2);
        dom.ctx.stroke();
        
        // 精英标记
        if (monster.isElite) {
          dom.ctx.fillStyle = 'gold';
          dom.ctx.font = `${gameData.cellSize * 0.4}px Arial`;
          dom.ctx.textAlign = 'center';
          dom.ctx.textBaseline = 'middle';
          dom.ctx.fillText('★', x + gameData.cellSize / 2, y + gameData.cellSize / 2);
        }
        
        // 特殊标记
        if (monster.type === 'shield') {
          dom.ctx.strokeStyle = 'white';
          dom.ctx.lineWidth = 2;
          dom.ctx.strokeRect(
            x + gameData.cellSize * 0.2,
            y + gameData.cellSize * 0.2,
            gameData.cellSize * 0.6,
            gameData.cellSize * 0.6
          );
        } else if (monster.type === 'bomber') {
          dom.ctx.fillStyle = 'white';
          dom.ctx.font = '10px Arial';
          dom.ctx.textAlign = 'center';
          dom.ctx.textBaseline = 'bottom';
          dom.ctx.fillText(`${Math.ceil(monster.bomberTimer)}`, x + gameData.cellSize / 2, y + gameData.cellSize * 0.8);
        }
        
        // 血条
        const healthPercent = monster.health / monster.maxHealth;
        dom.ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
        dom.ctx.fillRect(x, y - 5, gameData.cellSize, 4);
        dom.ctx.fillStyle = healthPercent > 0.5 ? '#10B981' : healthPercent > 0.25 ? '#F59E0B' : '#EF4444';
        dom.ctx.fillRect(x, y - 5, gameData.cellSize * healthPercent, 4);
        
        // 名称
        dom.ctx.fillStyle = 'white';
        dom.ctx.font = '8px Arial';
        dom.ctx.textAlign = 'center';
        dom.ctx.textBaseline = 'top';
        dom.ctx.fillText(monster.name, x + gameData.cellSize / 2, y + gameData.cellSize + 2);
      });
    }

    function renderProjectiles() {
      gameData.projectiles.forEach(projectile => {
        const x = gameData.gridOffset.x + projectile.position.x * gameData.cellSize + gameData.cellSize / 2;
        const y = gameData.gridOffset.y + projectile.position.y * gameData.cellSize + gameData.cellSize / 2;
        
        switch (projectile.type) {
          case 'normal':
            let color = '#3B82F6';
            switch (projectile.towerType) {
              case 'energy': color = '#3B82F6'; break;
              case 'rapid': color = '#10B981'; break;
              case 'ice': color = '#60A5FA'; break;
              case 'titan': color = '#1F2937'; break;
              case 'sniper': color = '#4B5563'; break;
            }
            dom.ctx.fillStyle = color;
            dom.ctx.beginPath();
            dom.ctx.arc(x, y, 5, 0, Math.PI * 2);
            dom.ctx.fill();
            break;
            
          case 'pierce':
            dom.ctx.fillStyle = '#8B5CF6';
            dom.ctx.save();
            dom.ctx.translate(x, y);
            const angle = Math.atan2(projectile.direction.y, projectile.direction.x);
            dom.ctx.rotate(angle);
            dom.ctx.beginPath();
            dom.ctx.moveTo(0, -3);
            dom.ctx.lineTo(8, 0);
            dom.ctx.lineTo(0, 3);
            dom.ctx.closePath();
            dom.ctx.fill();
            dom.ctx.restore();
            break;
            
          case 'rocket':
            dom.ctx.fillStyle = '#EF4444';
            dom.ctx.save();
            dom.ctx.translate(x, y);
            const dx = projectile.target.x - projectile.position.x;
            const dy = projectile.target.y - projectile.position.y;
            const rocketAngle = Math.atan2(dy, dx);
            dom.ctx.rotate(rocketAngle);
            dom.ctx.beginPath();
            dom.ctx.moveTo(0, -4);
            dom.ctx.lineTo(10, 0);
            dom.ctx.lineTo(0, 4);
            dom.ctx.closePath();
            dom.ctx.fill();
            dom.ctx.fillStyle = '#F59E0B';
            dom.ctx.beginPath();
            dom.ctx.moveTo(-5, -3);
            dom.ctx.lineTo(0, 0);
            dom.ctx.lineTo(-5, 3);
            dom.ctx.closePath();
            dom.ctx.fill();
            dom.ctx.restore();
            break;
            
          case 'electro':
            dom.ctx.fillStyle = '#F59E0B';
            dom.ctx.beginPath();
            dom.ctx.arc(x, y, 6, 0, Math.PI * 2);
            dom.ctx.fill();
            dom.ctx.strokeStyle = '#F59E0B';
            dom.ctx.lineWidth = 2;
            dom.ctx.beginPath();
            dom.ctx.arc(x, y, 8, 0, Math.PI * 2);
            dom.ctx.stroke();
            break;
            
          case 'howitzer':
            dom.ctx.fillStyle = '#DC2626';
            dom.ctx.save();
            dom.ctx.translate(x, y);
            const howitzerDx = projectile.target.x - projectile.position.x;
            const howitzerDy = projectile.target.y - projectile.position.y;
            const howitzerAngle = Math.atan2(howitzerDy, howitzerDx);
            dom.ctx.rotate(howitzerAngle);
            dom.ctx.beginPath();
            dom.ctx.moveTo(0, -6);
            dom.ctx.lineTo(12, 0);
            dom.ctx.lineTo(0, 6);
            dom.ctx.closePath();
            dom.ctx.fill();
            dom.ctx.fillStyle = '#F59E0B';
            dom.ctx.beginPath();
            dom.ctx.moveTo(-8, -4);
            dom.ctx.lineTo(0, 0);
            dom.ctx.lineTo(-8, 4);
            dom.ctx.closePath();
            dom.ctx.fill();
            dom.ctx.restore();
            break;
        }
      });
    }

    function renderExplosions() {
      gameData.explosions.forEach(exp => {
        const alpha = 1 - exp.time * 2;
        dom.ctx.fillStyle = `rgba(245, 158, 11, ${alpha})`;
        dom.ctx.beginPath();
        dom.ctx.arc(exp.x, exp.y, exp.radius * exp.time * 2, 0, Math.PI * 2);
        dom.ctx.fill();
        
        dom.ctx.fillStyle = `rgba(239, 68, 68, ${alpha * 0.7})`;
        dom.ctx.beginPath();
        dom.ctx.arc(exp.x, exp.y, exp.radius * exp.time * 1.5, 0, Math.PI * 2);
        dom.ctx.fill();
      });
    }

    function renderEffects() {
      gameData.effects.forEach(effect => {
        const alpha = 1 - effect.time;
        
        switch (effect.type) {
          case 'laser':
            dom.ctx.strokeStyle = `rgba(59, 130, 246, ${alpha})`;
            dom.ctx.lineWidth = 4;
            dom.ctx.beginPath();
            dom.ctx.moveTo(effect.x, effect.y);
            dom.ctx.lineTo(effect.x + Math.cos(effect.angle) * effect.length, effect.y + Math.sin(effect.angle) * effect.length);
            dom.ctx.stroke();
            
            dom.ctx.strokeStyle = `rgba(16, 185, 129, ${alpha * 0.5})`;
            dom.ctx.lineWidth = 8;
            dom.ctx.beginPath();
            dom.ctx.moveTo(effect.x, effect.y);
            dom.ctx.lineTo(effect.x + Math.cos(effect.angle) * effect.length, effect.y + Math.sin(effect.angle) * effect.length);
            dom.ctx.stroke();
            break;
            
          case 'freeze':
            dom.ctx.fillStyle = `rgba(96, 165, 250, ${alpha * 0.3})`;
            dom.ctx.beginPath();
            dom.ctx.arc(effect.x, effect.y, effect.size * (0.5 + effect.time * 0.5), 0, Math.PI * 2);
            dom.ctx.fill();
            break;
            
          case 'stun':
            dom.ctx.fillStyle = `rgba(245, 158, 11, ${alpha * 0.3})`;
            dom.ctx.beginPath();
            dom.ctx.arc(effect.x, effect.y, effect.size * (0.5 + effect.time * 0.5), 0, Math.PI * 2);
            dom.ctx.fill();
            break;
            
          case 'hit':
            dom.ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.5})`;
            dom.ctx.beginPath();
            dom.ctx.arc(effect.x, effect.y, effect.size * 0.3 * (1 + effect.time), 0, Math.PI * 2);
            dom.ctx.fill();
            break;
        }
      });
    }

    function renderFloatingTexts() {
      gameData.floatingTexts.forEach(text => {
        const alpha = 1 - (text.time / text.duration);
        dom.ctx.fillStyle = `${text.color}${Math.floor(alpha * 255).toString(16).padStart(2, '0')}`;
        dom.ctx.font = 'bold 16px Arial';
        dom.ctx.textAlign = 'center';
        dom.ctx.textBaseline = 'middle';
        dom.ctx.fillText(text.text, text.x, text.y);
      });
    }

    function renderSelectedCell() {
      // 加农炮目标选择
      if (gameData.isHowitzerTargeting && gameData.selectedTargetCell) {
        const centerX = gameData.gridOffset.x + gameData.selectedTargetCell.x * gameData.cellSize;
        const centerY = gameData.gridOffset.y + gameData.selectedTargetCell.y * gameData.cellSize;
        
        dom.ctx.strokeStyle = 'rgba(245, 158, 11, 0.8)';
        dom.ctx.lineWidth = 3;
        dom.ctx.strokeRect(centerX - 3 * gameData.cellSize, centerY - 3 * gameData.cellSize, 7 * gameData.cellSize, 7 * gameData.cellSize);
        
        dom.ctx.fillStyle = 'rgba(245, 158, 11, 0.3)';
        dom.ctx.fillRect(centerX, centerY, gameData.cellSize, gameData.cellSize);
        
        dom.ctx.strokeStyle = 'rgba(245, 158, 11, 0.5)';
        dom.ctx.lineWidth = 2;
        dom.ctx.strokeRect(centerX - gameData.cellSize, centerY - gameData.cellSize, 3 * gameData.cellSize, 3 * gameData.cellSize);
        return;
      }
      
      if (!gameData.selectedCell) return;
      
      const x = gameData.gridOffset.x + gameData.selectedCell.x * gameData.cellSize;
      const y = gameData.gridOffset.y + gameData.selectedCell.y * gameData.cellSize;
      
      // 格子边框颜色
      let strokeColor = 'rgba(255, 255, 255, 0.5)';
      if (gameData.blockedCells.has(`${gameData.selectedCell.x},${gameData.selectedCell.y}`)) {
        strokeColor = 'rgba(239, 68, 68, 0.8)';
      } else if (gameData.selectedTower && typeof gameData.selectedTower === 'string') {
        const towerData = gameData.towerTypes.find(t => t.id === gameData.selectedTower);
        strokeColor = (towerData && gameData.money >= towerData.price) ? 'rgba(16, 185, 129, 0.8)' : 'rgba(239, 68, 68, 0.8)';
        
        // 炮塔预览
        if (towerData && gameData.money >= towerData.price && !gameData.blockedCells.has(`${gameData.selectedCell.x},${gameData.selectedCell.y}`)) {
          dom.ctx.globalAlpha = 0.5;
          let color = '#3B82F6';
          switch (towerData.id) {
            case 'energy': color = '#3B82F6'; break;
            case 'rapid': color = '#10B981'; break;
            case 'ice': color = '#60A5FA'; break;
            case 'pierce': color = '#8B5CF6'; break;
            case 'laser': color = '#EC4899'; break;
            case 'rocket': color = '#EF4444'; break;
            case 'electro': color = '#F59E0B'; break;
            case 'titan': color = '#1F2937'; break;
            case 'sniper': color = '#4B5563'; break;
            case 'anti-air': color = '#3B82F6'; break;
            case 'flame': color = '#F59E0B'; break;
            case 'howitzer': color = '#DC2626'; break;
          }
          dom.ctx.fillStyle = color;
          dom.ctx.beginPath();
          dom.ctx.arc(x + gameData.cellSize / 2, y + gameData.cellSize / 2, gameData.cellSize / 3, 0, Math.PI * 2);
          dom.ctx.fill();
          
          dom.ctx.fillStyle = '#1F2937';
          dom.ctx.fillRect(x + gameData.cellSize / 2, y + gameData.cellSize / 2 - 2, gameData.cellSize / 3, 4);
          dom.ctx.globalAlpha = 1.0;
          
          // 射程预览
          dom.ctx.strokeStyle = 'rgba(16, 185, 129, 0.3)';
          dom.ctx.lineWidth = 2;
          dom.ctx.setLineDash([5, 5]);
          dom.ctx.beginPath();
          dom.ctx.arc(x + gameData.cellSize / 2, y + gameData.cellSize / 2, towerData.range * gameData.cellSize, 0, Math.PI * 2);
          dom.ctx.stroke();
          dom.ctx.setLineDash([]);
        }
      }
      
      dom.ctx.lineWidth = 3;
      dom.ctx.strokeStyle = strokeColor;
      dom.ctx.strokeRect(x, y, gameData.cellSize, gameData.cellSize);
    }

    // 音量控制初始化
    function initVolumeControls() {
      const musicToggle = document.getElementById('music-toggle');
      const sfxToggle = document.getElementById('sfx-toggle');
      const musicVolume = document.getElementById('music-volume');
      const sfxVolume = document.getElementById('sfx-volume');
      
      musicToggle.addEventListener('click', () => {
        const enabled = soundManager.toggleMusic();
        musicToggle.classList.toggle('muted', !enabled);
        musicToggle.className = enabled ? 'fa fa-music audio-toggle' : 'fa fa-music audio-toggle muted';
      });
      
      sfxToggle.addEventListener('click', () => {
        const enabled = soundManager.toggleSfx();
        sfxToggle.classList.toggle('muted', !enabled);
        sfxToggle.className = enabled ? 'fa fa-volume-up audio-toggle' : 'fa fa-volume-off audio-toggle muted';
      });
      
      musicVolume.addEventListener('input', () => {
        soundManager.setMusicVolume(parseFloat(musicVolume.value));
      });
      
      sfxVolume.addEventListener('input', () => {
        soundManager.setSfxVolume(parseFloat(sfxVolume.value));
      });
    }

    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', () => {
      soundManager.init();
      initGame();
      
      const versionElement = document.createElement('div');
      versionElement.textContent = 'V5.9.0 修复版';
      versionElement.className = 'fixed bottom-2 right-2 text-xs text-gray-400';
      document.body.appendChild(versionElement);
    });
  })();
  </script>
</body>
</html>
