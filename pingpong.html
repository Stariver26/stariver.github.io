<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>像素乒乓-GameBox</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background: #1a1a1a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
            overflow: hidden;
            position: relative;
        }
        /* 首页样式 */
        .home-screen {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .home-screen h1 {
            font-size: 48px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: color 0.2s;
            user-select: none;
        }
        .home-screen h1:hover {
            color: #4ade80;
        }
        .home-screen p {
            font-size: 20px;
            color: #aaa;
            margin-bottom: 30px;
        }
        .btn {
            padding: 18px 40px;
            font-size: 24px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
            margin: 0 auto;
            user-select: none;
        }
        .btn-ai {
            background: #2e7d32;
            color: #fff;
        }
        .btn-ai:hover {
            background: #388e3c;
        }
        .btn-settings {
            background: #2d3436;
            color: #81ecec;
        }
        .btn-settings:hover {
            background: #374149;
        }
        /* 游戏界面样式 */
        .game-screen {
            display: none;
            flex-direction: column;
            width: 100%;
            max-width: 600px;
        }
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            margin-bottom: 20px;
        }
        .back-btn {
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            user-select: none;
        }
        .game-title {
            color: #4ade80;
            font-size: 20px;
        }
        #gameCanvas {
            background: #1a1a1a;
            border: 2px solid #2d3436;
            width: 100%;
            height: auto;
            touch-action: none;
            user-select: none;
        }
        .score {
            display: flex;
            justify-content: center;
            gap: 80px;
            font-size: 36px;
            margin: 20px 0;
        }
        .score-left {
            color: #4ade80;
        }
        .score-right {
            color: #ef4444;
        }
        /* 倒计时样式 - 修复定位错位问题 */
        .countdown {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 72px;
            color: #fff;
            display: none;
            z-index: 10;
            text-shadow: 0 0 12px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        /* 胜负提示样式 */
        .result-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            cursor: pointer;
        }
        .result-box {
            background: #2d3436;
            padding: 40px 60px;
            border-radius: 16px;
            text-align: center;
            animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }
        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .result-text {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .win {
            color: #4ade80;
        }
        .lose {
            color: #ef4444;
        }
        /* 设置弹窗样式（含开发者选项） */
        .settings-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .settings-box {
            background: #2d3436;
            padding: 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 350px;
            text-align: center;
            animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .settings-box h2 {
            font-size: 28px;
            margin-bottom: 30px;
        }
        .setting-item {
            margin: 20px 0;
        }
        .setting-item label {
            font-size: 20px;
            margin-right: 15px;
        }
        #difficultySelect {
            padding: 8px 15px;
            font-size: 18px;
            border-radius: 8px;
            background: #444;
            color: #fff;
            border: none;
            outline: none;
            cursor: pointer;
        }
        .dev-item {
            margin: 25px 0;
            padding-top: 20px;
            border-top: 1px solid #444;
        }
        .dev-btn {
            padding: 10px 20px;
            background: #e67e22;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .dev-btn:hover {
            background: #d35400;
        }
        #closeSettings {
            margin-top: 25px;
            padding: 12px;
            background: #4ade80;
            color: #000;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            transition: all 0.2s;
            user-select: none;
        }
        #closeSettings:hover {
            transform: scale(1.05);
            background: #36d372;
        }
        /* 开发者得分调整弹窗（控制球出界得分） */
        .dev-score-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 110;
        }
        .dev-score-box {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 320px;
            animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .dev-score-box h3 {
            font-size: 22px;
            margin-bottom: 20px;
            text-align: center;
            color: #e67e22;
        }
        .score-input {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0;
        }
        .score-input label {
            font-size: 18px;
            color: #fff;
        }
        .score-input input {
            width: 80px;
            padding: 8px;
            background: #333;
            color: #fff;
            border: 1px solid #444;
            border-radius: 6px;
            outline: none;
            font-size: 16px;
            text-align: center;
        }
        .dev-score-btn {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }
        .dev-score-btn button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-save {
            background: #2ecc71;
            color: #fff;
        }
        .btn-save:hover {
            background: #27ae60;
        }
        .btn-cancel {
            background: #e74c3c;
            color: #fff;
        }
        .btn-cancel:hover {
            background: #c0392b;
        }
        /* 移动端适配 */
        @media (max-width: 600px) {
            .home-screen h1 {
                font-size: 36px;
            }
            .home-screen p {
                font-size: 16px;
            }
            .btn {
                padding: 14px 32px;
                font-size: 20px;
            }
            .score {
                font-size: 28px;
                gap: 60px;
            }
            .countdown {
                font-size: 56px;
            }
            .result-text {
                font-size: 36px;
            }
            .result-box {
                padding: 30px 40px;
            }
        }
    </style>
</head>
<body>
    <!-- 首页 -->
    <div class="home-screen" id="homeScreen">
        <h1 id="gameTitle">像素乒乓</h1>
        <p>经典乒乓对战，先得7分获胜！</p>
        <button class="btn btn-ai" id="startAI">🤖 人机对战</button>
        <button class="btn btn-settings" id="openSettings">⚙️ 设置</button>
    </div>
    <!-- 游戏界面 -->
    <div class="game-screen" id="gameScreen">
        <div class="game-header">
            <div class="back-btn" id="backBtn">← 返回</div>
            <div class="game-title">像素乒乓</div>
        </div>
        <div class="score">
            <span class="score-left" id="scoreLeft">0</span>
            <span class="score-right" id="scoreRight">0</span>
        </div>
        <canvas id="gameCanvas" width="600" height="400"></canvas>
        <div class="countdown" id="countdown">3</div>
    </div>
    <!-- 胜负提示弹窗 -->
    <div class="result-modal" id="resultModal">
        <div class="result-box">
            <div class="result-text win" id="resultText">你赢了！</div>
            <p style="color: #aaa; font-size: 16px;">点击任意位置返回主页</p>
        </div>
    </div>
    <!-- 设置弹窗（默认隐藏开发者选项） -->
    <div class="settings-modal" id="settingsModal">
        <div class="settings-box">
            <h2>⚙️ 设置</h2>
            <div class="setting-item">
                <label>难度：</label>
                <select id="difficultySelect">
                    <option value="easy" selected>简单</option>
                    <option value="normal">普通</option>
                    <option value="hard">困难</option>
                    <option value="hell">地狱</option>
                </select>
            </div>
            <!-- 开发者选项（初始隐藏） -->
            <div class="dev-item" id="devItem" style="display: none;">
                <button class="dev-btn" id="openDevModal">开发者选项</button>
            </div>
            <div id="closeSettings">确定</div>
        </div>
    </div>
    <!-- 开发者得分调整弹窗（控制球出界得分） -->
    <div class="dev-score-modal" id="devScoreModal">
        <div class="dev-score-box">
            <h3>开发者选项</h3>
            <div class="score-input">
                <label>玩家进球得分：</label>
                <input type="number" id="playerScoreInput" min="1" max="7" step="1" value="1">
            </div>
            <div class="score-input">
                <label>AI进球得分：</label>
                <input type="number" id="aiScoreInput" min="1" max="7" step="1" value="1">
            </div>
            <div class="dev-score-btn">
                <button class="btn-save" id="saveScore">保存</button>
                <button class="btn-cancel" id="cancelScore">取消</button>
            </div>
        </div>
    </div>
    <script>
        // IIFE隔离作用域，彻底解决全局变量污染
        (function() {
            // 元素获取
            const homeScreen = document.getElementById('homeScreen');
            const gameScreen = document.getElementById('gameScreen');
            const backBtn = document.getElementById('backBtn');
            const startAI = document.getElementById('startAI');
            const scoreLeftEl = document.getElementById('scoreLeft');
            const scoreRightEl = document.getElementById('scoreRight');
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const countdownEl = document.getElementById('countdown');
            const resultModal = document.getElementById('resultModal');
            const resultText = document.getElementById('resultText');
            const settingsModal = document.getElementById('settingsModal');
            const openSettings = document.getElementById('openSettings');
            const closeSettings = document.getElementById('closeSettings');
            const difficultySelect = document.getElementById('difficultySelect');
            // 彩蛋+开发者模式元素
            const gameTitle = document.getElementById('gameTitle');
            const devItem = document.getElementById('devItem');
            const openDevModal = document.getElementById('openDevModal');
            const devScoreModal = document.getElementById('devScoreModal');
            const playerScoreInput = document.getElementById('playerScoreInput');
            const aiScoreInput = document.getElementById('aiScoreInput');
            const saveScore = document.getElementById('saveScore');
            const cancelScore = document.getElementById('cancelScore');

            // 游戏核心变量
            let scoreLeft = 0, scoreRight = 0;
            const winningScore = 7;
            let gameRunning = false;
            let ballMoving = false;
            let isPaused = false; // 新增暂停状态，解决弹窗后台运行问题
            let aiSpeed = 4;
            let ballSpeedRate = 1;
            const baseVx = 4, baseVy = 4;
            // 得分配置
            let playerGoalScore = 1;
            let aiGoalScore = 1;
            // 彩蛋变量
            let titleClickCount = 0;
            let devModeUnlocked = false; // 新增解锁状态，避免重复触发
            // 球拍与球参数
            const paddleWidth = 12, paddleHeight = 80;
            const ballSize = 10;
            let leftPaddle = { x: 20, y: canvas.height/2 - paddleHeight/2, w: paddleWidth, h: paddleHeight };
            let rightPaddle = { x: canvas.width - 32, y: canvas.height/2 - paddleHeight/2, w: paddleWidth, h: paddleHeight };
            let ball = { x: canvas.width/2, y: canvas.height/2, r: ballSize/2, vx: baseVx * ballSpeedRate, vy: baseVy * ballSpeedRate };
            // AI逻辑优化变量
            let aiOffset = 0;
            // 定时器管理变量，解决定时器错乱问题
            let countdownTimer = null;
            let resultTimer = null;
            // 帧率补偿变量，解决高刷屏球速过快问题
            let lastTime = 0;
            const fixedTimeStep = 1000 / 60; // 固定60帧逻辑更新
            let accumulator = 0;

            // 难度设置函数
            function setDifficulty(level) {
                switch(level) {
                    case 'easy': 
                        aiSpeed = 2; 
                        ballSpeedRate = 0.8; // 修复原简单模式球速过慢，几乎无法出界的问题
                        break;
                    case 'normal': 
                        aiSpeed = 4; 
                        ballSpeedRate = 1; 
                        break;
                    case 'hard': 
                        aiSpeed = 6; 
                        ballSpeedRate = 1.2; 
                        break;
                    case 'hell': 
                        aiSpeed = 8; 
                        ballSpeedRate = 1.8; 
                        break;
                }
                // 同步球速
                ball.vx = baseVx * ballSpeedRate * (ball.vx > 0 ? 1 : -1);
                ball.vy = baseVy * ballSpeedRate * (ball.vy > 0 ? 1 : -1);
            }

            // 碰撞检测函数
            function checkCollision(rect1, rect2) {
                return rect1.x + rect1.w > rect2.x &&
                       rect1.x < rect2.x + rect2.w &&
                       rect1.y + rect1.h > rect2.y &&
                       rect1.y < rect2.y + rect2.h;
            }

            // 画布绘制函数
            function draw() {
                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                // 绘制中线
                ctx.strokeStyle = '#333';
                ctx.setLineDash([10, 10]);
                ctx.beginPath();
                ctx.moveTo(canvas.width/2, 0);
                ctx.lineTo(canvas.width/2, canvas.height);
                ctx.stroke();
                ctx.setLineDash([]);
                // 绘制球拍和球
                ctx.fillStyle = '#4ade80';
                ctx.fillRect(leftPaddle.x, leftPaddle.y, leftPaddle.w, leftPaddle.h);
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(rightPaddle.x, rightPaddle.y, rightPaddle.w, rightPaddle.h);
                ctx.fillStyle = '#fff';
                ctx.fillRect(ball.x - ball.r, ball.y - ball.r, ball.r*2, ball.r*2);
            }

            // 游戏状态更新函数
            function update(deltaTime) {
                // 游戏未运行或暂停时不更新逻辑
                if (!gameRunning || isPaused) return;

                // 固定时间步长更新，保证不同设备逻辑一致
                const steps = Math.floor(accumulator / fixedTimeStep);
                for (let i = 0; i < steps; i++) {
                    if (ballMoving) {
                        ball.x += ball.vx;
                        ball.y += ball.vy;

                        // 球上下边界反弹，修复穿透问题
                        if (ball.y - ball.r <= 0) {
                            ball.y = ball.r;
                            ball.vy = -ball.vy;
                        } else if (ball.y + ball.r >= canvas.height) {
                            ball.y = canvas.height - ball.r;
                            ball.vy = -ball.vy;
                        }

                        // 球碰撞矩形
                        const ballRect = {
                            x: ball.x - ball.r,
                            y: ball.y - ball.r,
                            w: ball.r * 2,
                            h: ball.r * 2
                        };

                        // 左球拍碰撞修正，修复穿透问题
                        if (ball.vx < 0 && checkCollision(ballRect, leftPaddle)) {
                            ball.x = leftPaddle.x + leftPaddle.w + ball.r;
                            ball.vx = Math.abs(baseVx * ballSpeedRate);
                            ball.vy = (ball.y - (leftPaddle.y + leftPaddle.h/2)) * 0.15 * ballSpeedRate;
                        }

                        // 右球拍碰撞修正，修复穿透问题
                        if (ball.vx > 0 && checkCollision(ballRect, rightPaddle)) {
                            ball.x = rightPaddle.x - ball.r;
                            ball.vx = -Math.abs(baseVx * ballSpeedRate);
                            ball.vy = (ball.y - (rightPaddle.y + rightPaddle.h/2)) * 0.15 * ballSpeedRate;
                        }
                    }

                    // AI追踪逻辑优化，解决简单模式球拍抖动问题
                    if (ball.vx > 0) {
                        // 球过中线时固定偏移量，避免每帧抖动
                        if (ball.x < canvas.width/2) {
                            aiOffset = difficultySelect.value === 'easy' ? Math.random() * 60 - 30 : 0;
                        }
                        const targetY = ball.y - rightPaddle.h/2 + aiOffset;
                        // 平滑追踪，避免瞬移
                        const diff = targetY - rightPaddle.y;
                        if (Math.abs(diff) > aiSpeed) {
                            rightPaddle.y += diff > 0 ? aiSpeed : -aiSpeed;
                        } else {
                            rightPaddle.y = targetY;
                        }
                    }

                    // 球拍边界限制
                    leftPaddle.y = Math.max(0, Math.min(canvas.height - leftPaddle.h, leftPaddle.y));
                    rightPaddle.y = Math.max(0, Math.min(canvas.height - rightPaddle.h, rightPaddle.y));

                    // 计分逻辑
                    if (ball.x + ball.r < 0) { // 球出左边界，AI得分
                        scoreRight += aiGoalScore;
                        scoreRightEl.textContent = scoreRight;
                        checkWin();
                        if (gameRunning) resetBall();
                    }
                    if (ball.x - ball.r > canvas.width) { // 球出右边界，玩家得分
                        scoreLeft += playerGoalScore;
                        scoreLeftEl.textContent = scoreLeft;
                        checkWin();
                        if (gameRunning) resetBall();
                    }
                }
                accumulator -= steps * fixedTimeStep;
            }

            // 重置球位置
            function resetBall() {
                // 先清除之前的倒计时，避免定时器叠加
                clearCountdown();
                // 重置球状态
                ball.x = canvas.width/2;
                ball.y = canvas.height/2;
                const randomDir = Math.random() > 0.5 ? 1 : -1;
                ball.vx = randomDir * baseVx * ballSpeedRate;
                ball.vy = (Math.random() - 0.5) * 6 * ballSpeedRate;
                ballMoving = false;
                // 启动新倒计时
                startCountdown();
            }

            // 胜利判断
            function checkWin() {
                if (scoreLeft >= winningScore) {
                    gameEnd('win');
                } else if (scoreRight >= winningScore) {
                    gameEnd('lose');
                }
            }

            // 游戏结束统一处理
            function gameEnd(result) {
                gameRunning = false;
                ballMoving = false;
                clearAllTimers(); // 清除所有定时器

                // 显示结果
                resultText.textContent = result === 'win' ? '你赢了！' : '你输了！';
                resultText.className = `result-text ${result}`;
                resultModal.style.display = 'flex';

                // 自动返回主页
                resultTimer = setTimeout(() => {
                    backToHome();
                }, 2000);
            }

            // 重置游戏
            function resetGame() {
                clearAllTimers();
                scoreLeft = 0;
                scoreRight = 0;
                scoreLeftEl.textContent = '0';
                scoreRightEl.textContent = '0';
                leftPaddle.y = canvas.height/2 - leftPaddle.h/2;
                rightPaddle.y = canvas.height/2 - rightPaddle.h/2;
                ball.x = canvas.width/2;
                ball.y = canvas.height/2;
                ballMoving = false;
                isPaused = false;
                // 同步开发者配置
                playerScoreInput.value = playerGoalScore;
                aiScoreInput.value = aiGoalScore;
            }

            // 倒计时函数，修复定时器叠加问题
            function startCountdown() {
                let count = 3;
                countdownEl.style.display = 'block';
                countdownEl.textContent = count;

                countdownTimer = setInterval(() => {
                    count--;
                    if (count > 0) {
                        countdownEl.textContent = count;
                    } else {
                        countdownEl.textContent = 'GO!';
                        setTimeout(() => {
                            countdownEl.style.display = 'none';
                            ballMoving = true;
                        }, 500);
                        clearInterval(countdownTimer);
                        countdownTimer = null;
                    }
                }, 500);
            }

            // 清除倒计时
            function clearCountdown() {
                if (countdownTimer) {
                    clearInterval(countdownTimer);
                    countdownTimer = null;
                }
                countdownEl.style.display = 'none';
            }

            // 清除所有定时器
            function clearAllTimers() {
                clearCountdown();
                if (resultTimer) {
                    clearTimeout(resultTimer);
                    resultTimer = null;
                }
            }

            // 返回主页统一处理
            function backToHome() {
                clearAllTimers();
                gameScreen.style.display = 'none';
                homeScreen.style.display = 'flex';
                resultModal.style.display = 'none';
                settingsModal.style.display = 'none';
                devScoreModal.style.display = 'none';
                resetGame();
            }

            // 游戏主循环，修复高刷屏球速不一致问题
            function gameLoop(timestamp) {
                if (!lastTime) lastTime = timestamp;
                const deltaTime = timestamp - lastTime;
                lastTime = timestamp;
                accumulator += deltaTime;

                draw();
                update(deltaTime);
                requestAnimationFrame(gameLoop);
            }

            // ********** 彩蛋：点击标题5次解锁开发者模式 **********
            gameTitle.addEventListener('click', () => {
                if (devModeUnlocked) return; // 解锁后不再触发
                titleClickCount++;
                if (titleClickCount >= 5) {
                    devModeUnlocked = true;
                    devItem.style.display = 'block';
                    titleClickCount = 0;
                    alert('✅ 开发者模式已解锁！');
                }
            });

            // ********** 开发者模式逻辑 **********
            // 打开开发者选项
            openDevModal.addEventListener('click', () => {
                const pwd = prompt('请输入开发者密码：');
                if (pwd === 'honjiu') {
                    settingsModal.style.display = 'none';
                    playerScoreInput.value = playerGoalScore;
                    aiScoreInput.value = aiGoalScore;
                    devScoreModal.style.display = 'flex';
                } else {
                    alert('❌ 密码错误！');
                }
            });

            // 保存得分配置
            saveScore.addEventListener('click', () => {
                let newPlayerScore = parseInt(playerScoreInput.value) || 1;
                let newAIScore = parseInt(aiScoreInput.value) || 1;
                // 强制限制范围
                newPlayerScore = Math.max(1, Math.min(7, newPlayerScore));
                newAIScore = Math.max(1, Math.min(7, newAIScore));
                // 更新配置
                playerGoalScore = newPlayerScore;
                aiGoalScore = newAIScore;
                // 同步输入框
                playerScoreInput.value = playerGoalScore;
                aiScoreInput.value = aiGoalScore;
                devScoreModal.style.display = 'none';
                alert(`✅ 配置已生效！玩家进球得${playerGoalScore}分，AI进球得${aiGoalScore}分`);
            });

            // 取消得分调整
            cancelScore.addEventListener('click', () => {
                devScoreModal.style.display = 'none';
            });

            // ********** 球拍控制 **********
            // 鼠标控制
            canvas.addEventListener('mousemove', (e) => {
                const rect = canvas.getBoundingClientRect();
                const scaleY = canvas.height / rect.height;
                leftPaddle.y = (e.clientY - rect.top) * scaleY - leftPaddle.h/2;
            });

            // 触摸控制，修复passive报错问题
            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                const touch = e.touches[0];
                const scaleY = canvas.height / rect.height;
                leftPaddle.y = (touch.clientY - rect.top) * scaleY - leftPaddle.h/2;
            }, { passive: false });

            // ********** 按钮事件 **********
            // 开始游戏
            startAI.addEventListener('click', () => {
                homeScreen.style.display = 'none';
                gameScreen.style.display = 'flex';
                gameRunning = true;
                resetBall();
            });

            // 返回按钮
            backBtn.addEventListener('click', backToHome);

            // 打开设置
            openSettings.addEventListener('click', () => {
                isPaused = true; // 打开设置时暂停游戏
                settingsModal.style.display = 'flex';
            });

            // 关闭设置
            closeSettings.addEventListener('click', () => {
                // 地狱难度确认
                if (difficultySelect.value === 'hell') {
                    // 避免重复创建弹窗
                    if (document.getElementById('hellConfirmModal')) return;
                    
                    const hellModal = document.createElement('div');
                    hellModal.id = 'hellConfirmModal';
                    hellModal.style.cssText = `
                        position: fixed;
                        top: 0;
                        left: 0;
                        width: 100%;
                        height: 100%;
                        background: rgba(0,0,0,0.92);
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        z-index: 1000;
                    `;
                    
                    hellModal.innerHTML = `
                        <div style="
                            background: #2d3436;
                            padding: 30px;
                            border-radius: 16px;
                            text-align: center;
                            max-width: 400px;
                            border: 2px solid #ef4444;
                            animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
                        ">
                            <div style="color: #ef4444; font-size: 32px; margin-bottom: 20px;">⚠️ 警告 ⚠️</div>
                            <div style="color: #fff; font-size: 18px; margin-bottom: 30px; line-height: 1.6;">
                                地狱难度将大幅提升AI反应速度与球速，
                                操作难度极高，你确定要开启吗？
                            </div>
                            <div style="display: flex; gap: 15px; justify-content: center;">
                                <button id="hellConfirm" style="
                                    padding: 12px 25px;
                                    background: #ef4444;
                                    color: #fff;
                                    border: none;
                                    border-radius: 8px;
                                    font-size: 16px;
                                    font-weight: bold;
                                    cursor: pointer;
                                    transition: all 0.2s;
                                ">确定</button>
                                <button id="hellCancel" style="
                                    padding: 12px 25px;
                                    background: #2e7d32;
                                    color: #fff;
                                    border: none;
                                    border-radius: 8px;
                                    font-size: 16px;
                                    font-weight: bold;
                                    cursor: pointer;
                                    transition: all 0.2s;
                                ">取消</button>
                            </div>
                        </div>
                    `;
                    
                    document.body.appendChild(hellModal);
                    
                    // 确认按钮
                    document.getElementById('hellConfirm').addEventListener('click', () => {
                        settingsModal.style.display = 'none';
                        setDifficulty('hell');
                        isPaused = false;
                        document.body.removeChild(hellModal);
                    });
                    
                    // 取消按钮
                    document.getElementById('hellCancel').addEventListener('click', () => {
                        difficultySelect.value = 'easy';
                        setDifficulty('easy');
                        document.body.removeChild(hellModal);
                    });
                } else {
                    settingsModal.style.display = 'none';
                    setDifficulty(difficultySelect.value);
                    isPaused = false;
                }
            });

            // 点击结果弹窗关闭返回
            resultModal.addEventListener('click', backToHome);

            // 点击弹窗背景关闭
            settingsModal.addEventListener('click', (e) => {
                if (e.target === settingsModal) {
                    settingsModal.style.display = 'none';
                    isPaused = false;
                }
            });
            devScoreModal.addEventListener('click', (e) => {
                if (e.target === devScoreModal) {
                    devScoreModal.style.display = 'none';
                }
            });

            // 阻止弹窗内部点击冒泡
            document.querySelectorAll('.settings-box, .dev-score-box, .result-box').forEach(el => {
                el.addEventListener('click', (e) => e.stopPropagation());
            });

            // 初始化
            setDifficulty(difficultySelect.value);
            requestAnimationFrame(gameLoop);
        })();
    </script>
</body>
</html>
